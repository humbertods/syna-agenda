      {reservas.length===0?<div className="empty" style={{padding:'12px 0'}}>Sin reservas SYNA para este filtro.</div>:reservas.map(r=><div className="cli-visita" key={r.id}><div className="cli-v-top"><span className="cli-v-srv">{r.servicio}</span><span className="cli-v-tot">{r.duracion_estimada_min} min</span></div><div className="cli-v-meta">{fechaCorta(r.fecha)} · {r.hora_inicio}–{r.hora_fin} · {r.estado}{r.nex_ticket?(' · '+r.nex_ticket):''}</div></div>)}
      <div className="cli-sec">Tiempo operativo / Lineas NexServ</div>
      {visitas.length===0?<div className="empty" style={{padding:'12px 0'}}>Sin líneas NexServ para este filtro.</div>:visitas.map(v=><div className="cli-box" key={v.visita}><div className="cli-box-t">{v.fecha} · {v.estados.join(', ')} · promo {money(v.totalPromo)}{Math.abs((v.totalRegular||0)-(v.totalPromo||0))>0.01?' · regular '+money(v.totalRegular):''}</div>{v.lineas.map(l=><div className="cli-visita" key={l.id}><div className="cli-v-top"><span className="cli-v-srv">{l.servicio}</span><span className="cli-v-tot">{money(l.monto)}</span></div><div className="cli-v-meta">{l.hora||''} · {l.area||''}{l.staff?(' · '+l.staff):' · sin staff'} · {l.estado}{l.metodoPago?(' · '+l.metodoPago):''}</div>{l.obs?<div className="ficha-sub">{l.obs}</div>:null}</div>)}</div>)}
      <div className="cli-sec">Observaciones permanentes staff</div>
      {obs.length===0?<div className="empty" style={{padding:'12px 0'}}>Sin comentarios permanentes.</div>:obs.slice(0,8).map((o,i)=><div className="cli-visita" key={i}><div className="cli-v-meta">{o.fecha} {o.hora} · {o.area} · {o.staff}</div><div className="ficha-sub">{o.observacion}</div></div>)}
      <div className="cli-sec">Fichas</div>
      <div className="cli-visita">{(fichas.facial||[]).length>0?<FichaDetalle tipo="facial" items={fichas.facial}/>:null}{(fichas.pestanas||[]).length>0?<FichaDetalle tipo="pestanas" items={fichas.pestanas}/>:null}{(fichas.cejas||[]).length>0?<FichaDetalle tipo="cejas" items={fichas.cejas}/>:null}{!(fichas.facial||[]).length&&!(fichas.pestanas||[]).length&&!(fichas.cejas||[]).length?<div className="empty" style={{padding:'8px 0'}}>Sin fichas registradas.</div>:null}</div>
    </>}
  </div>;
}

/* ---------- Adaptación IA: plantillas, respuestas rápidas y patrones ---------- */
const ADAPT_TPL=[
  ['Precio','Hola, ¿cuánto cuesta el servicio?','Indicar precio claro, duración aproximada y cerrar preguntando día/horario.'],
  ['Agenda mañana','Quiero una cita mañana en la tarde','Confirmar servicio exacto, ofrecer máximo 2 horarios y pedir confirmación.'],
  ['Promo','¿Qué promos tienen esta semana?','Explicar promos vigentes sin saturar y recomendar según necesidad.'],
  ['Recomendación','No sé qué hacerme en cejas','Hacer una pregunta de diagnóstico y recomendar sin asumir.'],
  ['Cambio de cita','Necesito cambiar mi cita','Responder con empatía, pedir día/franja nueva y confirmar disponibilidad.'],
  ['Cancelación','No puedo ir hoy','Responder amable, preguntar si desea reagendar y registrar cancelación.'],
  ['Llega tarde','Voy 20 minutos tarde','Explicar política operativa y ofrecer alternativa si afecta agenda.'],
  ['Duración','¿Cuánto demora?','Dar duración realista y preparar expectativa de espera/atención.'],
  ['Pago/abono','¿Aceptan transferencia?','Explicar métodos de pago/abono y cierre de reserva.'],
  ['Indecisa','Déjeme pensarlo','Responder con cierre suave, resumir beneficio y dejar pregunta simple.']
];
const QUICK_BASE=['Hola hermosa, con gusto te ayudo.','¿Para qué día y horario te gustaría agendar?','Tenemos disponibilidad en estos horarios:','Para reservar se confirma con abono.','Te paso la ubicación:','Tu cita queda confirmada para','Si deseas podemos reagendar sin problema.','Ese servicio dura aproximadamente','Te recomiendo esta opción porque','¿Te confirmo ese horario?'];
function AdaptacionIA(){
  const load=(k,def)=>{ try{ return JSON.parse(localStorage.getItem(k)||'null')||def; }catch(e){ return def; } };
  const recDefault={cita:'',abono:'',cuentas:'',gps:'',emojis:'✨ 💜 ✅ 📅 💬',areas:{cejas:[],depilacion:[],pestanas:[],facial:[]}};
  const [tab,setTab]=useState('plantillas');
  const [tpl,setTpl]=useState(()=>load('syna_adapt_templates',[]));
  const [tplOpen,setTplOpen]=useState(null);
  const [quick,setQuick]=useState(()=>load('syna_quick_replies',QUICK_BASE));
  const [rec,setRec]=useState(()=>load('syna_adapt_recursos',recDefault));
  const [tono,setTono]=useState(()=>localStorage.getItem('syna_adapt_tono')||'Tono cálido, claro, profesional, con cierre hacia agenda. Máximo 2 o 3 opciones de horario.');
  const [guardado,setGuardado]=useState('');
  const [patrones,setPatrones]=useState(()=>load('syna_patrones_chat',[]));
  const aviso=(msg)=>{ setGuardado(msg); setTimeout(()=>setGuardado(''),2600); };
  const storeJson=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ aviso('No se pudo guardar: una imagen es muy pesada. Prueba con una imagen más liviana.'); return false; } };
  const storeText=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ aviso('No se pudo guardar en este navegador.'); return false; } };
  const imgFile=(file,cb)=>{ const rd=new FileReader(); rd.onload=()=>{ const src=String(rd.result||''); const im=new Image(); im.onload=()=>{ const max=900, sc=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(im.width*sc)); cv.height=Math.max(1,Math.round(im.height*sc)); const cx=cv.getContext('2d'); cx.drawImage(im,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',.72)); }; im.onerror=()=>cb(src); im.src=src; }; rd.readAsDataURL(file); };
  const saveTpl=(next)=>{ if(storeJson('syna_adapt_templates',next)) setTpl(next); };
  const saveQuick=(next)=>{ if(storeJson('syna_quick_replies',next)) setQuick(next); };
  const saveRec=(next)=>{ if(storeJson('syna_adapt_recursos',next)) setRec(next); };
  const saveTono=(v)=>{ if(storeText('syna_adapt_tono',v)) setTono(v); };
  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getAdaptacionIA'); if(!(r&&r.ok&&r.adaptacion)) return; if(r.vacio){ aviso('Adaptación IA local lista para subir: toca Guardar'); return; } const a=r.adaptacion; if(Array.isArray(a.plantillas)){ setTpl(a.plantillas); storeJson('syna_adapt_templates',a.plantillas); } if(Array.isArray(a.rapidas)){ setQuick(a.rapidas.length?a.rapidas:QUICK_BASE); storeJson('syna_quick_replies',a.rapidas.length?a.rapidas:QUICK_BASE); } if(a.recursos){ setRec(a.recursos); storeJson('syna_adapt_recursos',a.recursos); } if(a.tono){ setTono(a.tono); storeText('syna_adapt_tono',a.tono); } if(Array.isArray(a.patrones)){ setPatrones(a.patrones); storeJson('syna_patrones_chat',a.patrones); } aviso('Adaptación IA cargada desde la app'); }catch(e){ aviso('Usando cache local de este dispositivo'); } })(); },[]);
  const guardarTodo=async()=>{ const data={tono,plantillas:tpl,rapidas:quick.filter(q=>String(q||'').trim()),recursos:rec,patrones}; const ok=storeJson('syna_adapt_templates',data.plantillas)&&storeJson('syna_quick_replies',data.rapidas)&&storeJson('syna_adapt_recursos',data.recursos)&&storeText('syna_adapt_tono',data.tono)&&storeJson('syna_patrones_chat',data.patrones); if(!ok)return; try{ const r=await apiPost('saveAdaptacionIA',{adaptacion:data}); aviso(r&&r.ok?'Guardado en la app para todos los dispositivos':'Guardado local, pero no en servidor'); }catch(e){ aviso('Guardado local, sin conexión al servidor'); } };
  const setT=(i,patch)=>saveTpl(tpl.map((x,j)=>j===i?{...x,...patch}:x));
  const mensajesTpl=t=> (t.mensajes&&t.mensajes.length?t.mensajes:[{role:'clienta',text:t.cliente||'',image:''},{role:'syna',text:t.respuesta||'',image:''}]);
  const setMsgTpl=(ti,mi,patch)=>setT(ti,{mensajes:mensajesTpl(tpl[ti]).map((m,j)=>j===mi?{...m,...patch}:m)});
  const addMsgTpl=(ti,role)=>setT(ti,{mensajes:[...mensajesTpl(tpl[ti]),{role,text:'',image:''}]});
  const delMsgTpl=(ti,mi)=>setT(ti,{mensajes:mensajesTpl(tpl[ti]).filter((_,j)=>j!==mi)});
  const imgMsgTpl=(ti,mi)=>{ const m=mensajesTpl(tpl[ti])[mi]||{}; return m.image?<div><img src={m.image} style={{width:'100%',borderRadius:10,marginTop:8}}/><button className="chip" onClick={()=>setMsgTpl(ti,mi,{image:''})}>Quitar imagen</button></div>:<input type="file" accept="image/*" className="inp" onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; imgFile(f,src=>setMsgTpl(ti,mi,{image:src})); }}/>; };
  const nuevaTpl=()=>{ const next=[...tpl,{titulo:'Nueva situación',guia:'',mensajes:[{role:'clienta',text:'',image:''},{role:'syna',text:'',image:''}]}]; saveTpl(next); setTplOpen(next.length-1); };
  const delTpl=i=>{ const next=tpl.filter((_,j)=>j!==i); saveTpl(next); setTplOpen(null); };
  const setQ=(i,v)=>saveQuick(quick.map((x,j)=>j===i?v:x));
  const addQ=()=>saveQuick([...quick,'']);
  const delQ=i=>saveQuick(quick.filter((_,j)=>j!==i));
  const img=(key,label)=> <div className="cli-visita"><div className="cli-v-top"><span className="cli-v-srv">{label}</span>{rec[key]?<button className="chip" onClick={()=>saveRec({...rec,[key]:''})}>Quitar</button>:null}</div>{rec[key]?<img src={rec[key]} style={{width:'100%',borderRadius:12,marginTop:8}}/>:<input type="file" accept="image/*" className="inp" onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; imgFile(f,src=>saveRec({...rec,[key]:src})); }}/>}</div>;
  const areaList=key=>{ const v=(rec.areas||{})[key]; return Array.isArray(v)?v:(v?[{src:v,desc:''}]:[]); };
  const saveAreaList=(key,list)=>saveRec({...rec,areas:{...(rec.areas||{}),[key]:list}});
  const addAreaFiles=(key,files)=>{ const arr=Array.from(files||[]); if(!arr.length)return; const current=areaList(key); let pending=arr.length, added=[]; arr.forEach(f=>{ imgFile(f,src=>{ added.push({src,desc:''}); pending--; if(pending===0) saveAreaList(key,[...current,...added]); }); }); };
  const imgArea=(key,label)=>{ const list=areaList(key); return <div className="cli-visita"><div className="cli-v-top"><span className="cli-v-srv">{label}</span><span className="cli-v-tot">{list.length} img</span></div><input type="file" accept="image/*" multiple className="inp" onChange={e=>addAreaFiles(key,e.target.files)} />{list.map((it,i)=><div key={i} className="cli-visita"><img src={it.src} style={{width:'100%',borderRadius:12,marginTop:8}}/><label className="nf-l">Descripción / servicios de esta imagen</label><textarea className="inp" style={{minHeight:70,resize:'vertical'}} value={it.desc||''} onChange={e=>saveAreaList(key,list.map((x,j)=>j===i?{...x,desc:e.target.value}:x))} placeholder="Ej. Limpieza profunda, hidratación, peeling, beneficios..."/><button className="chip" onClick={()=>saveAreaList(key,list.filter((_,j)=>j!==i))}>Quitar imagen</button></div>)}</div>; };
  return <div className="fade">
    <div className="sec-title">Adaptación IA</div>
    <div className="promo-hint">Edita plantillas y respuestas rápidas para enseñarle a SYNA cómo habla y vende tu empresa.</div>
    <div className="cli-toggle" style={{marginBottom:14}}>
      <button className={"cli-tg"+(tab==='plantillas'?' on':'')} onClick={()=>setTab('plantillas')}>Plantillas</button>
      <button className={"cli-tg"+(tab==='rapidas'?' on':'')} onClick={()=>setTab('rapidas')}>Respuestas rápidas</button>
      <button className={"cli-tg"+(tab==='recursos'?' on':'')} onClick={()=>setTab('recursos')}>Recursos</button>
      <button className={"cli-tg"+(tab==='patrones'?' on':'')} onClick={()=>setTab('patrones')}>Patrones</button>
    </div>
    {tab==='plantillas'&&<>
      <label>Reglas de tono</label><textarea className="inp" style={{minHeight:90,resize:'vertical'}} value={tono} onChange={e=>saveTono(e.target.value)} />
      <button className="btn" onClick={nuevaTpl}>+ Nueva plantilla</button>
      {tpl.length===0&&<div className="empty" style={{padding:'18px 0'}}>Toca “Nueva plantilla” para crear tu primera simulación de chat.</div>}
      {tpl.map((t,i)=><div className="pcard" key={i}>
        <button className="addx" style={{width:'100%',textAlign:'left'}} onClick={()=>setTplOpen(tplOpen===i?null:i)}>{tplOpen===i?'▾':'▸'} {t.titulo||('Plantilla '+(i+1))}</button>
        {tplOpen===i&&<>
          <label className="nf-l">Nombre de la situación</label><input className="inp" value={t.titulo||''} onChange={e=>setT(i,{titulo:e.target.value})} placeholder="Ej. Agendar cejas sábado" />
          <div className="promo-hint">Simulación tipo WhatsApp. Toca/escribe cada mensaje y sube imagen en el momento correcto.</div>
          <div style={{background:'#efe7db',borderRadius:18,padding:12,margin:'10px 0'}}>
            {mensajesTpl(t).map((m,mi)=><div key={mi} style={{display:'flex',justifyContent:m.role==='syna'?'flex-end':'flex-start',marginBottom:8}}>
              <div style={{maxWidth:'86%',background:m.role==='syna'?'#d9fdd3':'#fff',borderRadius:12,padding:8,boxShadow:'0 1px 2px rgba(0,0,0,.08)'}}>
                <select className="sel" value={m.role} onChange={e=>setMsgTpl(i,mi,{role:e.target.value})}><option value="clienta">Clienta</option><option value="syna">SYNA / empresa</option></select>
                <textarea className="inp" style={{minHeight:70,resize:'vertical',marginTop:6}} placeholder={m.role==='clienta'?'Mensaje de la clienta':'Respuesta ideal de SYNA'} value={m.text||''} onChange={e=>setMsgTpl(i,mi,{text:e.target.value})}/>
                {imgMsgTpl(i,mi)}
                <button className="chip" style={{marginTop:6}} onClick={()=>delMsgTpl(i,mi)}>Quitar mensaje</button>
              </div>
            </div>)}
          </div>
          <div className="chips" style={{marginBottom:10}}><button className="chip" onClick={()=>addMsgTpl(i,'clienta')}>+ Mensaje clienta</button><button className="chip" onClick={()=>addMsgTpl(i,'syna')}>+ Respuesta SYNA</button></div>
          <label className="nf-l">Regla/guía de esta simulación</label><textarea className="inp" style={{minHeight:65,resize:'vertical'}} value={t.guia||''} onChange={e=>setT(i,{guia:e.target.value})}/>
          <button className="btn" onClick={guardarTodo}>Guardar plantilla / chats</button>
          <button className="btn-prev" onClick={()=>delTpl(i)}>Eliminar plantilla</button>
        </>}
      </div>)}
    </>}
    {tab==='rapidas'&&<>
      {quick.map((q,i)=><div className="srow" key={i}><input className="inp" value={q} onChange={e=>setQ(i,e.target.value)} placeholder="Respuesta rápida"/><button className="srow-x" onClick={()=>delQ(i)}>×</button></div>)}
      <button className="addx" onClick={addQ}>+ Agregar respuesta rápida</button>
      <button className="btn" onClick={guardarTodo}>Guardar respuestas rápidas</button>
    </>}
    {tab==='recursos'&&<>
      <div className="promo-hint">Guarda aquí los materiales que ya usas en WhatsApp para que SYNA los tenga como referencia comercial.</div>
      {img('cita','Imagen: cita agendada')}
      {img('abono','Imagen: cita con abono agendada')}
      {img('cuentas','Imagen: números de cuentas')}
      <label className="nf-l">Link GPS del local</label><input className="inp" value={rec.gps||''} onChange={e=>saveRec({...rec,gps:e.target.value})} placeholder="https://maps.app.goo.gl/..." />
      <label className="nf-l">Emojis usados durante asignación de cita</label><input className="inp" value={rec.emojis||''} onChange={e=>saveRec({...rec,emojis:e.target.value})} placeholder="✨ 💜 ✅ 📅" />
      <div className="cli-sec">Imágenes por área de servicio</div>
      {imgArea('cejas','Área: Cejas')}
      {imgArea('depilacion','Área: Depilación')}
      {imgArea('pestanas','Área: Pestañas')}
      {imgArea('facial','Área: Facial')}
      <button className="btn" onClick={guardarTodo}>Guardar recursos</button>
    </>}
    {guardado&&<div className="ok-msg" style={{textAlign:'center',marginTop:10}}>{guardado}</div>}
    {tab==='patrones'&&<>
      <div className="promo-hint">Estos patrones salen de las respuestas que modificas en el Copiloto.</div>
      {patrones.length===0?<div className="empty" style={{padding:'18px 0'}}>Aún no hay patrones guardados.</div>:patrones.slice().reverse().map((p,i)=><div className="cli-visita" key={i}><div className="cli-v-meta">{new Date(p.fecha).toLocaleString()}</div><div className="ficha-sub"><b>Original:</b> {p.original}</div><div className="ficha-sub"><b>Corregida:</b> {p.corregida}</div></div>)}
    </>}
  </div>;
}

      <div className="card stub">

/* ---------- Login (acceso a la app) ---------- */
/* NEXCERT:SECTION:LOGIN */
function Login({onLogin}){
  const [u,setU]=useState('');
  const [pw,setPw]=useState('');
  const [cargando,setCargando]=useState(false);
  const [err,setErr]=useState('');
  const entrar=async()=>{
    if(!u.trim()||!pw){ setErr('Ingresa usuario y contraseña'); return; }
    setCargando(true); setErr('');
    try{
      const r=await apiPost('login',{usuario:u.trim(),password:pw});
      if(r&&r.ok) onLogin(r); else setErr((r&&r.error)||'No se pudo ingresar');
    }catch(e){ setErr('Error de conexión'); }
    setCargando(false);
  };
  return (
    <div className="login">
      <div className="login-in">
        <div className="login-top">
          <img className="lg" src="logo_icon_solo.png" alt="SYNA" />
          <div className="field">
            <label>Usuario</label>
            <input className="inp" value={u} autoCapitalize="none" autoCorrect="off"
              onChange={e=>setU(e.target.value)} placeholder="Tu usuario" />
          </div>
          <div className="field">
            <label>Contraseña</label>
            <input className="inp" type="password" value={pw} placeholder="••••••••"
              onChange={e=>setPw(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') entrar(); }} />
          </div>
          <button className="btn" disabled={cargando} onClick={entrar}>
            {cargando?'Ingresando…':'Ingresar'}</button>
          {err && <div className="err">{err}</div>}
        </div>
        <div className="login-bottom">
          <div className="desc">SYNA es la agenda inteligente de tu centro de estética. Reserva, reagenda y organiza las citas de todas tus áreas en un solo lugar.</div>
          <div className="dev">
            <div className="by">Desarrollado por</div>
            <div className="co">DESOUSATECH S.A.</div>
          </div>
        </div>
      </div>
    </div>
  );
}
/* /NEXCERT:SECTION:LOGIN */

/* NEXCERT:SECTION:RENDER */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
/* /NEXCERT:SECTION:RENDER */
