<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2E1A6B" />
<title>SYNA · Agenda</title>
<link rel="icon" type="image/png" href="icon_SYNA.png" />
<link rel="apple-touch-icon" href="icon_SYNA.png" />

<!-- ============================================================= -->
<!--  CONFIG: si cambias el deploy del Apps Script, pega aquí       -->
<!--  la nueva URL que termina en /exec                            -->
<!-- ============================================================= -->
<script>
  window.SYNA_API = "https://script.google.com/macros/s/AKfycbxShQ8OsbaXajcaqI-D3_QWWszIkTvoi6b-R3UXqvjmirDCkfvY6rtm60ivXfDsnc8q/exec";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#2B2722; --soft:#938A7E;
    --line:#ECE6DD; --line2:#E2DACE;
    --cejas:#7CB342; --pestanas:#E8924B; --facial:#4A90D9;
    --brand:#5B3BC4; --brand-deep:#2E1A6B; --brand-soft:#EDE8FA;
    --shadow:0 1px 2px rgba(43,39,34,.04),0 8px 24px rgba(43,39,34,.06);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",sans-serif}
  body{min-height:100dvh}
  #app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .display{font-family:"Fraunces",serif}

  header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:flex-start}
  .logo{height:34px;width:auto;display:block;mix-blend-mode:multiply}
  main{flex:1;padding:4px 16px 110px;overflow-y:auto}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sec-title{font-family:"Fraunces",serif;font-weight:500;font-size:20px;margin:18px 4px 10px}
  .muted{color:var(--soft)}

  /* area cards */
  .areas{display:flex;flex-direction:column;gap:12px}
  .area-btn{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;transition:transform .12s ease,border-color .12s ease}
  .area-btn:active{transform:scale(.985)}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  .area-btn .name{font-size:17px;font-weight:500}
  .area-btn .sub{font-size:13px;color:var(--soft)}
  .area-btn .chev{margin-left:auto;color:var(--line2);font-size:20px}

  /* search + list */
  .search{width:100%;padding:13px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);
    font-family:inherit;font-size:15px;color:var(--ink);outline:none}
  .search:focus{border-color:var(--brand)}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .svc{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease}
  .svc:active{transform:scale(.99)}
  .svc .info{flex:1;min-width:0;text-align:left}
  .svc .nm{display:block;font-size:15px;font-weight:500;line-height:1.25}
  .svc .meta{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
  .svc .price{font-weight:600;font-size:15px;white-space:nowrap}

  /* date */
  .date-input{width:100%;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);
    font-family:inherit;font-size:16px;color:var(--ink);outline:none}
  .date-input:focus{border-color:var(--brand)}

  /* slots */
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .slot{padding:11px 0;border:1px solid var(--line2);border-radius:12px;background:var(--surface);
    font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;text-align:center;transition:all .1s ease}
  .slot:active{transform:scale(.95)}
  .slot.on{color:#fff;border-color:transparent}

  /* form */
  label{display:block;font-size:13px;color:var(--soft);margin:14px 4px 6px}
  .inp{width:100%;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;background:var(--surface);
    font-family:inherit;font-size:16px;color:var(--ink);outline:none}
  .inp:focus{border-color:var(--brand)}

  .btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#3A2280,#6B4AD0);color:#fff;
    font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .15s ease,transform .12s ease;margin-top:18px}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}

  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--soft);
    font-family:inherit;font-size:14px;cursor:pointer;padding:6px 4px;margin-bottom:2px}

  .summary{padding:18px;border-radius:var(--radius)}
  .summary .row{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;border-bottom:1px dashed var(--line)}
  .summary .row:last-child{border-bottom:none}
  .summary .k{color:var(--soft)}

  /* agenda */
  .resv{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
    background:var(--surface);box-shadow:var(--shadow);margin-top:10px;border-left-width:4px}
  .resv .time{font-weight:600;font-size:15px;white-space:nowrap}
  .resv .time small{display:block;font-weight:400;color:var(--soft);font-size:12px}
  .resv .who{font-size:15px;font-weight:500}
  .resv .what{font-size:13px;color:var(--soft);margin-top:1px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap}
  .x{margin-left:auto;background:none;border:none;color:var(--line2);font-size:20px;cursor:pointer;align-self:flex-start;line-height:1}

  .empty{text-align:center;color:var(--soft);padding:48px 20px;font-size:15px}

  /* chat asistente */
  .chat-msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:84px}
  .bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap}
  .bubble.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
  .bubble.me{align-self:flex-end;background:linear-gradient(135deg,#3A2280,#6B4AD0);color:#fff;border-bottom-right-radius:5px}
  .typing{align-self:flex-start;color:var(--soft);font-size:14px;padding:4px 6px}
  .chatbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:6}
  .chatbar-in{max-width:480px;width:100%;display:flex;gap:8px;background:var(--bg);padding:8px 0}
  .chatbar input{flex:1;padding:13px 16px;border:1px solid var(--line2);border-radius:22px;background:var(--surface);font-family:inherit;font-size:15px;color:var(--ink);outline:none}
  .chatbar input:focus{border-color:var(--brand)}
  .chatbar .send{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:50%;background:linear-gradient(135deg,#3A2280,#6B4AD0);color:#fff;font-size:20px;cursor:pointer}
  .chatbar .send:disabled{opacity:.4}
  .ok-circle{width:72px;height:72px;border-radius:50%;background:var(--cejas);display:flex;align-items:center;justify-content:center;margin:24px auto 8px}

  /* tab bar */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,247,242,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}
  .tabwrap{max-width:480px;width:100%;display:flex}
  .tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px;color:var(--soft);font-family:inherit;font-size:11px;font-weight:500}
  .tab.on{color:var(--brand-deep)}
  .tab svg{width:23px;height:23px}

  .spinner{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--ink);border-radius:50%;
    animation:spin .7s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const API = window.SYNA_API;

/* ---------- API helpers ---------- */
async function apiGet(action, params={}){
  const qs = new URLSearchParams({action, ...params}).toString();
  const r = await fetch(`${API}?${qs}`);
  return r.json();
}
async function apiPost(action, params={}){
  const r = await fetch(API, {method:'POST', body: JSON.stringify({action, ...params})});
  return r.json();
}

/* ---------- utilidades ---------- */
const hoy = () => { const d=new Date(); const z=n=>(n<10?'0':'')+n; return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaBonita(f){ const m=f.match(/(\d{4})-(\d{2})-(\d{2})/); if(!m)return f;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return `${DIAS[d.getDay()]} ${+m[3]} ${MES[+m[2]-1]}`; }
const ESTADOS={confirmada:['#EAF3DE','#3B6D11'],pendiente:['#FAEEDA','#854F0B'],
  completada:['#E6F1FB','#0C447C'],cancelada:['#F1EFE8','#5F5E5A'],no_show:['#FCEBEB','#A32D2D']};

/* ---------- App ---------- */
function App(){
  const [tab,setTab]=useState('reservar');
  const [areas,setAreas]=useState([]);
  const [servicios,setServicios]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [err,setErr]=useState('');

  useEffect(()=>{(async()=>{
    try{
      const [a,s]=await Promise.all([apiGet('getAreas'),apiGet('getServicios')]);
      if(a.ok) setAreas(a.areas);
      if(s.ok) setServicios(s.servicios);
      if(!a.ok||!s.ok) setErr('No se pudo cargar el catálogo.');
    }catch(e){ setErr('Error de conexión con la API.'); }
    setCargando(false);
  })()},[]);

  const colorArea = nm => (areas.find(a=>a.area===nm)||{}).color || '#999';

  return (
    <div id="app">
      <header>
        <img className="logo" src="Logo_Syna.png" alt="SYNA agenda" />
      </header>
      <main>
        {cargando ? <div className="spinner"></div> :
         err ? <div className="empty">{err}<br/><br/>Revisa que la URL de la API esté bien.</div> :
         tab==='reservar' ? <Reservar areas={areas} servicios={servicios} colorArea={colorArea}/> :
         tab==='asistente' ? <Asistente/> :
         <Agenda servicios={servicios} colorArea={colorArea}/>}
      </main>
      <nav>
        <div className="tabwrap">
          <button className={"tab"+(tab==='reservar'?' on':'')} onClick={()=>setTab('reservar')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4M12 13v4M10 15h4"/></svg>
            Reservar
          </button>
          <button className={"tab"+(tab==='asistente'?' on':'')} onClick={()=>setTab('asistente')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8A8.38 8.38 0 0 1 12.5 3a8.38 8.38 0 0 1 8.5 8.5z"/></svg>
            Asistente
          </button>
          <button className={"tab"+(tab==='agenda'?' on':'')} onClick={()=>setTab('agenda')}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4M7.5 13h.01M7.5 17h.01M12 13h5M12 17h5"/></svg>
            Agenda
          </button>
        </div>
      </nav>
    </div>
  );
}

/* ---------- Flujo de reservar ---------- */
function Reservar({areas,servicios,colorArea}){
  const [paso,setPaso]=useState(1);
  const [area,setArea]=useState(null);
  const [svc,setSvc]=useState(null);
  const [fecha,setFecha]=useState(hoy());
  const [slots,setSlots]=useState(null);
  const [cerrado,setCerrado]=useState(false);
  const [hora,setHora]=useState(null);
  const [q,setQ]=useState('');
  const [nombre,setNombre]=useState('');
  const [tel,setTel]=useState('');
  const [enviando,setEnviando]=useState(false);
  const [reserva,setReserva]=useState(null);
  const [aviso,setAviso]=useState('');

  const reset=()=>{setPaso(1);setArea(null);setSvc(null);setFecha(hoy());setSlots(null);
    setHora(null);setQ('');setNombre('');setTel('');setReserva(null);setAviso('');};

  const cargarSlots=async(servId,f)=>{
    setSlots(null);setCerrado(false);setHora(null);
    try{
      const r=await apiGet('getDisponibilidad',{servicio_id:servId,fecha:f});
      if(r.ok){ setSlots(r.slots||[]); setCerrado(!!r.cerrado); }
      else { setSlots([]); setAviso(r.error||'Error'); }
    }catch(e){ setSlots([]); setAviso('Error de conexión'); }
  };

  const confirmar=async()=>{
    if(!nombre.trim()) return setAviso('Pon el nombre de la clienta');
    setEnviando(true);setAviso('');
    try{
      const r=await apiPost('crearReserva',{servicio_id:svc.id,fecha,hora_inicio:hora,
        cliente_nombre:nombre.trim(),telefono:tel.trim()});
      if(r.ok){ setReserva(r.reserva); setPaso(5); }
      else setAviso(r.error||'No se pudo reservar');
    }catch(e){ setAviso('Error de conexión al reservar'); }
    setEnviando(false);
  };

  const filtrados = useMemo(()=> servicios
    .filter(s=>s.area===area)
    .filter(s=>s.servicio.toLowerCase().includes(q.toLowerCase())),
    [servicios,area,q]);

  /* paso 5: confirmación */
  if(paso===5 && reserva) return (
    <div className="fade" style={{textAlign:'center'}}>
      <div className="ok-circle" style={{background:colorArea(reserva.area)}}>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div className="display" style={{fontSize:22,fontWeight:600}}>¡Reserva creada!</div>
      <div className="card summary" style={{marginTop:18,textAlign:'left'}}>
        <div className="row"><span className="k">Servicio</span><span>{svc.servicio}</span></div>
        <div className="row"><span className="k">Fecha</span><span>{fechaBonita(reserva.fecha)}</span></div>
        <div className="row"><span className="k">Hora</span><span>{reserva.hora_inicio}–{reserva.hora_fin}</span></div>
        <div className="row"><span className="k">Clienta</span><span>{reserva.cliente_nombre}</span></div>
        <div className="row"><span className="k">Atiende</span><span>{reserva.staff_asignado}</span></div>
      </div>
      <button className="btn" onClick={reset}>Nueva reserva</button>
    </div>
  );

  return (
    <div className="fade">
      {paso>1 && <button className="back" onClick={()=>{setAviso('');setPaso(paso-1);}}>‹ Atrás</button>}

      {/* paso 1: área */}
      {paso===1 && <>
        <div className="sec-title">¿Qué área?</div>
        <div className="areas">
          {areas.map(a=>(
            <button key={a.area} className="area-btn" onClick={()=>{setArea(a.area);setPaso(2);}}>
              <span className="dot" style={{background:a.color}}></span>
              <span><span className="name">{a.area}</span><br/><span className="sub">{a.staff} staff</span></span>
              <span className="chev">›</span>
            </button>
          ))}
        </div>
      </>}

      {/* paso 2: servicio */}
      {paso===2 && <>
        <div className="sec-title">Servicio · {area}</div>
        <input className="search" placeholder="Buscar servicio…" value={q} onChange={e=>setQ(e.target.value)} />
        <div className="list">
          {filtrados.map(s=>(
            <button key={s.id} className="svc" onClick={()=>{setSvc(s);setPaso(3);cargarSlots(s.id,fecha);}}>
              <span className="dot" style={{background:colorArea(s.area)}}></span>
              <span className="info"><span className="nm">{s.servicio}</span>
                <span className="meta">{s.duracion} min{s.solapable?' · solapable':''}</span></span>
              <span className="price">${s.precio}</span>
            </button>
          ))}
          {filtrados.length===0 && <div className="empty">Sin resultados</div>}
        </div>
      </>}

      {/* paso 3: fecha + hora */}
      {paso===3 && svc && <>
        <div className="sec-title">{svc.servicio}</div>
        <label>Fecha</label>
        <input type="date" className="date-input" value={fecha} min={hoy()}
          onChange={e=>{setFecha(e.target.value);cargarSlots(svc.id,e.target.value);}} />
        {slots===null ? <div className="spinner"></div> :
         cerrado ? <div className="empty">Cerrado ese día 🌙</div> :
         slots.length===0 ? <div className="empty">No hay horarios disponibles</div> :
         <div className="slots">
           {slots.map(h=>(
             <button key={h} className={"slot"+(hora===h?' on':'')}
               style={hora===h?{background:colorArea(svc.area)}:null}
               onClick={()=>setHora(h)}>{h}</button>
           ))}
         </div>}
        <button className="btn" disabled={!hora} onClick={()=>setPaso(4)}>Continuar</button>
      </>}

      {/* paso 4: datos clienta */}
      {paso===4 && <>
        <div className="sec-title">Datos de la clienta</div>
        <div className="card summary" style={{marginBottom:8}}>
          <div className="row"><span className="k">Servicio</span><span>{svc.servicio}</span></div>
          <div className="row"><span className="k">Cuándo</span><span>{fechaBonita(fecha)} · {hora}</span></div>
        </div>
        <label>Nombre *</label>
        <input className="inp" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Nombre de la clienta" />
        <label>Teléfono</label>
        <input className="inp" type="tel" value={tel} onChange={e=>setTel(e.target.value)} placeholder="0999999999" />
        {aviso && <div style={{color:'#A32D2D',fontSize:14,marginTop:12,textAlign:'center'}}>{aviso}</div>}
        <button className="btn" disabled={enviando} onClick={confirmar}>
          {enviando?'Reservando…':'Confirmar reserva'}</button>
      </>}
    </div>
  );
}

/* ---------- Agenda del día ---------- */
function Agenda({servicios,colorArea}){
  const [fecha,setFecha]=useState(hoy());
  const [resv,setResv]=useState(null);
  const svcMap=useMemo(()=>{const m={};servicios.forEach(s=>m[s.id]=s);return m;},[servicios]);

  const cargar=async(f)=>{
    setResv(null);
    try{ const r=await apiGet('getReservas',{fecha:f}); setResv(r.ok?r.reservas:[]); }
    catch(e){ setResv([]); }
  };
  useEffect(()=>{cargar(fecha)},[]);

  const cancelar=async(id)=>{
    if(!confirm('¿Cancelar esta reserva?')) return;
    await apiPost('cancelarReserva',{id});
    cargar(fecha);
  };

  const ordenadas=(resv||[]).slice().sort((a,b)=>a.hora_inicio.localeCompare(b.hora_inicio));

  return (
    <div className="fade">
      <div className="sec-title">Agenda</div>
      <input type="date" className="date-input" value={fecha}
        onChange={e=>{setFecha(e.target.value);cargar(e.target.value);}} />
      {resv===null ? <div className="spinner"></div> :
       ordenadas.length===0 ? <div className="empty">Sin reservas para {fechaBonita(fecha)}</div> :
       ordenadas.map(r=>{
         const s=svcMap[r.servicio_id]; const c=colorArea(r.area);
         const est=ESTADOS[r.estado]||['#F1EFE8','#5F5E5A'];
         return (
           <div key={r.id} className="resv" style={{borderLeftColor:c}}>
             <div className="time">{r.hora_inicio}<small>{r.hora_fin}</small></div>
             <div style={{flex:1,minWidth:0}}>
               <div className="who">{r.cliente_nombre||'—'}</div>
               <div className="what">{s?s.servicio:r.servicio_id} · {r.area} · {r.staff_asignado}</div>
               <span className="badge" style={{background:est[0],color:est[1],marginTop:6,display:'inline-block'}}>{r.estado}</span>
             </div>
             {r.estado!=='cancelada' && <button className="x" onClick={()=>cancelar(r.id)}>×</button>}
           </div>
         );
       })}
    </div>
  );
}

/* ---------- Asistente (chat IA) ---------- */
function Asistente(){
  const [msgs,setMsgs]=useState([{role:'assistant',text:'Hola 👋 Soy el asistente de SYNA. Dime qué necesitas — por ejemplo: "agenda depilación de cejas mañana a las 3pm para Ana".'}]);
  const [input,setInput]=useState('');
  const [cargando,setCargando]=useState(false);
  const finRef = React.useRef(null);

  useEffect(()=>{ if(finRef.current) finRef.current.scrollIntoView({behavior:'smooth'}); },[msgs,cargando]);

  const enviar=async()=>{
    const t=input.trim(); if(!t||cargando) return;
    const nuevos=[...msgs,{role:'user',text:t}];
    setMsgs(nuevos); setInput(''); setCargando(true);
    try{
      const r=await apiPost('chat',{history:nuevos});
      setMsgs(m=>[...m,{role:'assistant',text:r.reply||'(sin respuesta)'}]);
    }catch(e){ setMsgs(m=>[...m,{role:'assistant',text:'Ups, error de conexión. Intenta de nuevo.'}]); }
    setCargando(false);
  };

  return (
    <div className="fade">
      <div className="chat-msgs">
        {msgs.map((m,i)=>(
          <div key={i} className={"bubble "+(m.role==='assistant'?'bot':'me')}>{m.text}</div>
        ))}
        {cargando && <div className="typing">escribiendo…</div>}
        <div ref={finRef}></div>
      </div>
      <div className="chatbar"><div className="chatbar-in">
        <input value={input} placeholder="Escribe un mensaje…"
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') enviar(); }} />
        <button className="send" disabled={cargando||!input.trim()} onClick={enviar}>↑</button>
      </div></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
