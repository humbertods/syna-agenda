/* ---------- Flujo de reservar (multi-persona) ---------- */
/* ---------- Previsualización: ver agenda real + espacios disponibles ---------- */
function Previsualizacion({dia, servicio, onClose, onConfirm}){
  const [disp,setDisp]=useState(null);
  const [citas,setCitas]=useState([]);
  const [horDia,setHorDia]=useState(null);
  const [err,setErr]=useState('');
  const [franja,setFranja]=useState('dia');
  const [sel,setSel]=useState('');
  const pm=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
  const hLbl=h=>{const ap=h<12?'am':'pm';let x=h%12;if(x===0)x=12;return x+ap;};
  const HOR={1:['09:00','19:00'],2:['09:00','19:00'],3:['09:00','19:00'],4:['09:00','19:00'],5:['09:00','19:00'],6:['08:00','17:00'],0:null};
  useEffect(()=>{ (async()=>{
    try{ setErr(''); const [d,r,h]=await Promise.all([apiGet('getDisponibilidad',{servicio_id:servicio.id,fecha:dia}),apiGet('getReservas',{fecha:dia}),apiGet('getHorarioDia',{fecha:dia})]);
      setDisp(d.ok?d:{slots:[],cerrado:false});
      setCitas((r.ok?r.reservas:[]).filter(c=>String(c.area)===String(servicio.area) && !['cancelada','no_show'].includes(String(c.estado||'').toLowerCase())));
      setHorDia(h.ok?h:null);
    }catch(e){ setErr(e&&e.message?e.message:'Error de conexión'); setDisp({slots:[]}); }
  })(); },[]);
  const dow=new Date(dia+'T12:00:00').getDay(); const hh=horDia ? (horDia.cerrado?null:[horDia.abre,horDia.cierra]) : HOR[dow];
  const abre=hh?pm(hh[0]):540, cierra=hh?pm(hh[1]):1140, CORTE=13*60;
  const fIni=franja==='tarde'?CORTE:abre, fFin=franja==='manana'?CORTE:cierra;
  const PPM=franja==='dia'?1.35:2.3, tlH=Math.max(150,(fFin-fIni)*PPM);
  const horas=[]; for(let h=Math.ceil(fIni/60);h*60<=fFin;h++)horas.push(h);
  const dur=servicio.duracion||30;
  const slotsF=((disp&&disp.slots)?disp.slots:[]).filter(t=>{const m=pm(t);return m!=null&&m>=fIni&&m<fFin;});
  const selM=sel?pm(sel):null;
  return (
    <div className="sheet-ov" onClick={onClose}>
      <div className="prev-screen" onClick={e=>e.stopPropagation()}>
        <div className="prev-h"><span>Previsualización</span><button className="prev-x" onClick={onClose} aria-label="Cerrar">×</button></div>
        <div className="prev-sub">{servicio.servicio} · {servicio.area} · {fechaCorta(dia)}</div>
        {err && <div style={{color:'#E5484D',fontSize:12,textAlign:'center',margin:'6px 0'}}>Error: {err}</div>}
        <div className="franja-seg">
          {[['manana','Mañana'],['tarde','Tarde'],['dia','Todo el día']].map(([k,l])=>
            <button key={k} className={"franja-b"+(franja===k?' on':'')} onClick={()=>setFranja(k)}>{l}</button>)}
        </div>
        {disp===null ? <div className="spinner"></div> :
         disp.cerrado ? <div className="empty" style={{padding:'22px 0'}}>Ese día no laboramos 🌙</div> :
         <>
           <div className="prev-tl">
             <div className="prev-gutter" style={{height:tlH}}>
               {horas.map(h=><div key={h} className="tl-hlabel" style={{top:(h*60-fIni)*PPM}}>{hLbl(h)}</div>)}
             </div>
             <div className="prev-col" style={{height:tlH}}>
               {horas.map(h=><div key={h} className="tl-line" style={{top:(h*60-fIni)*PPM}}></div>)}
               {citas.map((c,i)=>{ const ci=pm(c.hora_inicio), cf=pm(c.hora_fin)||(ci+30); if(ci==null||cf<=fIni||ci>=fFin)return null;
                 const top=Math.max(0,(ci-fIni)*PPM), hgt=Math.max(15,(Math.min(cf,fFin)-Math.max(ci,fIni))*PPM);
                 return <div key={i} className="prev-busy" style={{top,height:hgt}}><span>{c.cliente_nombre||'Ocupado'}</span></div>; })}
               {selM!=null && selM>=fIni && selM<fFin && <div className="prev-ghost" style={{top:(selM-fIni)*PPM, height:Math.max(18,dur*PPM)}}><span>{sel} · libre</span></div>}
             </div>
           </div>
           <div className="prev-lbl">Espacios disponibles{slotsF.length?(' · '+slotsF.length):''}</div>
           {slotsF.length===0 ? <div className="empty" style={{padding:'10px 0'}}>No hay espacios libres en esta franja.</div> :
            <div className="prev-chips">{slotsF.map(t=><button key={t} className={"prev-chip"+(sel===t?' on':'')} onClick={()=>setSel(t)}>{t}</button>)}</div>}
           {disp.manual && <div style={{marginTop:14}}>
             <div className="prev-lbl" style={{marginBottom:6}}>Otro horario (manual)</div>
             <input type="time" step="300" value={/^\d{2}:\d{2}$/.test(sel)?sel:''} onChange={e=>setSel(e.target.value)}
               style={{padding:'10px 12px',border:'1.5px solid var(--line,#ddd)',borderRadius:10,fontSize:15,background:'var(--surface,#fff)',color:'inherit'}} />
             <div className="muted" style={{fontSize:12,marginTop:5}}>Para brow/pigmento puedes elegir una hora exacta distinta a las de arriba.</div>
           </div>}
         </>}
        <button className="prev-confirm" disabled={!sel} onClick={()=>onConfirm(sel)}>{sel?('Confirmar horario · '+sel):'Elige un espacio'}</button>
      </div>
    </div>
  );
}

function Reservar({areas,servicios,colorArea}){
  const MAXSERV=5;
  const nuevaPersona=()=>({modo:'existente',cliente_id:'',_cli:null,hist:null,q:'',open:'',nombre:'',apellido:'',cedula:'',correo:'',tel:'',filas:[{area:'',sid:''}]});
  const [modoReserva,setModoReserva]=useState('agenda');
  const [dia,setDia]=useState(hoy());
  const [hora,setHora]=useState('');
  const [personas,setPersonas]=useState([nuevaPersona()]);
  const [promos,setPromos]=useState(null);
  const [enviando,setEnviando]=useState(false);
  const [aviso,setAviso]=useState('');
  const [hecho,setHecho]=useState(null);
  const [preview,setPreview]=useState(null);
  const [clientas,setClientas]=useState(null);
  const [horDia,setHorDia]=useState(null);

  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getPromos'); setPromos(r.ok?r.promos:[]); }catch(e){ setPromos([]); } })(); },[]);
  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getClientes'); setClientas(r.ok?(r.clientes||[]):[]); }catch(e){ setClientas([]); } })(); },[]);
  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getHorarioDia',{fecha:dia}); setHorDia(r.ok?r:null); }catch(e){ setHorDia(null); } })(); },[dia]);
  const svcPorId=useMemo(()=>{const m={};servicios.forEach(s=>m[s.id]=s);return m;},[servicios]);
  const money=n=>'$'+Math.round(n||0);

  const HOR={1:['09:00','19:00'],2:['09:00','19:00'],3:['09:00','19:00'],4:['09:00','19:00'],5:['09:00','19:00'],6:['08:00','17:00'],0:null};
  const pm=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
  const hhmm=m=>{const z=n=>(n<10?'0':'')+n;return z(Math.floor(m/60))+':'+z(m%60);};
  const esPestanas=srv=>{ const txt=((srv&&srv.area)||'')+' '+((srv&&srv.servicio)||''); return /pesta|lifting/i.test(txt); };
  const dow=new Date(dia+'T12:00:00').getDay();
  const hBase=horDia ? (horDia.cerrado?null:[horDia.abre,horDia.cierra]) : HOR[dow];
  const cerrado=!hBase;
  const graciaPestanas=useMemo(()=>{ const sels=[];
    personas.forEach(p=>(p.filas||[]).forEach(f=>{ if(!f.sid || f.area==='__promo__')return; sels.push(svcPorId[f.sid]||{area:f.area,servicio:''}); }));
    return sels.length===0 || sels.every(esPestanas);
  },[personas,svcPorId]);
  const horOpts=useMemo(()=>{ const h=hBase; if(!h)return []; const a=pm(h[0]),c=pm(h[1]),o=[];
    for(let t=a;t<c;t+=15){ o.push(hhmm(t)); }
    return o;
  },[dia,horDia,graciaPestanas]);
  useEffect(()=>{ if(hora && horOpts.indexOf(hora)<0)setHora(''); },[hora,horOpts]);

  const setPer=(i,patch)=>setPersonas(ps=>ps.map((p,j)=>j===i?{...p,...patch}:p));
  const setFila=(pi,fi,patch)=>setPersonas(ps=>ps.map((p,j)=>j!==pi?p:{...p,filas:p.filas.map((f,k)=>k===fi?{...f,...patch}:f)}));
  const addFila=pi=>setPersonas(ps=>ps.map((p,j)=>j!==pi?p:(p.filas.length>=MAXSERV?p:{...p,filas:[...p.filas,{area:'',sid:''}]})));
  const delFila=(pi,fi)=>setPersonas(ps=>ps.map((p,j)=>j!==pi?p:(p.filas.length>1?{...p,filas:p.filas.filter((_,k)=>k!==fi)}:p)));

  const addPersona=()=>setPersonas(ps=>[...ps,nuevaPersona()]);
  const delPersona=i=>setPersonas(ps=>ps.length>1?ps.filter((_,j)=>j!==i):ps);
  const clientasFiltradas=(q)=>{ const t=String(q||'').toLowerCase().trim(); if(!t) return [];
    return (clientas||[]).filter(c=>String(c.nombre||'').toLowerCase().indexOf(t)>=0 || String(c.codigo||'').toLowerCase().indexOf(t)>=0 || String(c.telefono||'').indexOf(t)>=0); };
  const pickCliente=async(pi,c)=>{ setPer(pi,{cliente_id:c.codigo,nombre:c.nombre,_cli:c,hist:null,q:'',open:''});
    try{ const r=await apiGet('getHistorial',{codigo:c.codigo}); setPer(pi,{hist:(r&&r.ok)?r:{visitas:[],fichas:{facial:[],pestanas:[]}}}); }
    catch(e){ setPer(pi,{hist:{visitas:[],fichas:{facial:[],pestanas:[]}}}); } };

  const promoDe=num=>(promos||[]).find(p=>p.numero===num)||null;
  const filaPrecio=f=> f.area==='__promo__' ? ((promoDe(f.sid)&&promoDe(f.sid).precio)||0) : ((svcPorId[f.sid]&&+svcPorId[f.sid].precio)||0);
  const totalPrecio=personas.reduce((s,p)=> s + p.filas.reduce((a,f)=>a+(f.sid?filaPrecio(f):0),0),0);
  const resumenCita=c=>`${fechaBonita(c.fecha)} ${c.hora_inicio||''}${c.servicio?(' · '+c.servicio):''}`;

  const confirmarDuplicadosSemana=async()=>{
    for(let i=0;i<personas.length;i++){
      const p=personas[i];
      const nom=p.modo==='nueva' ? ((p.nombre||'').trim()+' '+(p.apellido||'').trim()).trim() : (p.nombre||'').trim();
      if(!p.cliente_id && !nom)continue;
      let r;
      try{ r=await apiGet('getCitasClienteSemana',{cliente_id:p.cliente_id||'',cliente_nombre:nom,fecha:dia}); }
      catch(e){ return window.confirm('No pude verificar si la clienta ya está agendada esta semana. ¿Desea continuar de todos modos?'); }
      const citas=(r&&r.ok)?(r.citas||[]):[];
      if(citas.length){
        const lista=citas.slice(0,3).map(resumenCita).join('\n');
        const extra=citas.length>3?'\n...y '+(citas.length-3)+' más':'';
        const nombre=nom||('Persona '+(i+1));
        if(!window.confirm(`${nombre} ya está agendada esta semana:\n${lista}${extra}\n\n¿Desea agendarle otra cita?`))return false;
      }
    }
    return true;
  };

  const agendar=async()=>{
    if(modoReserva==='agenda' && !hora) return setAviso('Elige la hora');
    const payload=[];
    for(let i=0;i<personas.length;i++){ const p=personas[i];
      if(p.modo==='existente' && !p.cliente_id) return setAviso('Elige la clienta existente en la persona '+(i+1));
      if(p.modo==='nueva' && !p.nombre.trim()) return setAviso('Falta el nombre de la persona '+(i+1));
      const items=[];
      for(const f of p.filas){ if(!f.sid)continue; items.push(f.area==='__promo__'?{k:'p',num:f.sid}:{k:'s',id:f.sid}); }
      if(!items.length) return setAviso('Elige al menos un servicio en la persona '+(i+1));
      const nomFull=p.modo==='nueva' ? ((p.nombre||'').trim()+' '+(p.apellido||'').trim()).trim() : (p.nombre||'').trim();
      payload.push({cliente_id:p.cliente_id||'',cliente_nombre:nomFull,telefono:(p.tel||'').trim(),cedula:(p.cedula||'').trim(),correo:(p.correo||'').trim(),items});
    }
    setEnviando(true); setAviso('');
    try{
      if(modoReserva==='agenda'){
        const okDup=await confirmarDuplicadosSemana();
        if(!okDup){ setEnviando(false); return; }
      }
      const action=modoReserva==='ahora'?'atenderAhora':'crearCitaGrupo';
      const body=modoReserva==='ahora'?{personas:payload}:{fecha:dia,hora_inicio:hora,personas:payload};
      const r=await apiPost(action,body);
      if(r.ok) setHecho(r); else setAviso(r.error||'No se pudo agendar'); }
    catch(e){ setAviso('Error de conexión: '+(e&&e.message?e.message:'reintenta')); }
    setEnviando(false);
  };
  const reset=()=>{ setHecho(null);setDia(hoy());setHora('');setPersonas([nuevaPersona()]);setAviso(''); };

  if(hecho) return (
    <div className="fade" style={{textAlign:'center'}}>
      <div className="ok-circle" style={{background:'var(--brand)'}}>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div className="display" style={{fontSize:22,fontWeight:600}}>{hecho.modo==='atender_ahora'?'¡Clienta enviada a lista de espera!':`¡Cita${hecho.personas.length>1?'s':''} agendada${hecho.personas.length>1?'s':''}!`}</div>
      <div style={{fontSize:14,color:'var(--soft)',marginTop:4,textTransform:'capitalize'}}>{fechaLarga(hecho.fecha)}</div>
      {hecho.personas.map((per,i)=>(
        <div className="card summary" key={i} style={{marginTop:14,textAlign:'left'}}>
          <div className="row"><span className="k" style={{fontWeight:700}}>{per.cliente_nombre}</span><span></span></div>
          {per.citas.map(c=><div className="row" key={c.id}><span className="k" style={{fontWeight:400}}>{c.servicio}</span><span>{c.hora_inicio}–{c.hora_fin} · {c.staff_asignado}</span></div>)}
        </div>
      ))}
      {hecho.modo==='atender_ahora' && hecho.llegada && hecho.llegada.nex && !hecho.llegada.nex.ok ? <div className="aviso" style={{marginTop:12}}>Se creó en SYNA, pero NexServ respondió: {hecho.llegada.nex.error||'revisar ticket'}</div> : null}
      <button className="btn" onClick={reset}>Nueva cita</button>
    </div>
  );

  return (
    <div className="fade">
      <div className="sec-title">Nueva cita</div>

      <div className="cli-toggle" style={{marginBottom:14}}>
        <button className={"cli-tg"+(modoReserva==='ahora'?' on':'')} onClick={()=>{setModoReserva('ahora');setAviso('');}}>Atender ahora</button>
        <button className={"cli-tg"+(modoReserva==='agenda'?' on':'')} onClick={()=>{setModoReserva('agenda');setAviso('');}}>Agendar para después</button>
      </div>
      <div className="promo-hint">{modoReserva==='ahora'?'Para clientas que ya están en el local: se crea en SYNA y pasa directo a Lista de espera en NexServ.':'Para reservar una hora futura: SYNA la guarda en agenda y la manda a Prelista cuando llegue la hora.'}</div>

      {modoReserva==='agenda' && <>
        <div className="grid2">
          <div><label>Día</label>
            <input type="date" className="date-input" value={dia} min={hoy()} onChange={e=>{setDia(e.target.value);setHora('');}} /></div>
          <div><label>Hora</label>
            <select className="sel" value={hora} onChange={e=>setHora(e.target.value)}>
              <option value="">{cerrado?'Cerrado 🌙':'Elige hora…'}</option>
              {horOpts.map(h=><option key={h} value={h}>{h}</option>)}
            </select></div>
        </div>
        <div className="promo-hint">Todas las personas inician a la hora elegida (en paralelo, cada una con su staff).</div>
      </>}

      {personas.map((p,pi)=>(
        <div className="pcard" key={pi}>
          <div className="pcard-h"><span>Persona {pi+1}</span>{personas.length>1 && <button className="srow-x" onClick={()=>delPersona(pi)} aria-label="Quitar persona">×</button>}</div>
          <div className="cli-toggle">
            <button className={"cli-tg"+(p.modo==='existente'?' on':'')} onClick={()=>setPer(pi,{modo:'existente'})}>Clienta Existente</button>
            <button className={"cli-tg"+(p.modo==='nueva'?' on':'')} onClick={()=>setPer(pi,{modo:'nueva',cliente_id:'',_cli:null,hist:null})}>+ Clienta Nueva</button>
          </div>
          {p.modo==='nueva' ? <>
            <label className="nf-l">Nombre</label>
            <input className="inp" placeholder="María Fernanda" value={p.nombre} onChange={e=>setPer(pi,{nombre:e.target.value})} />
            <label className="nf-l">Apellido</label>
            <input className="inp" placeholder="López Reyes" value={p.apellido||''} onChange={e=>setPer(pi,{apellido:e.target.value})} />
            <label className="nf-l">Cédula / RUC <span className="nf-opt">(opcional)</span></label>
            <input className="inp" placeholder="0912345678" value={p.cedula||''} onChange={e=>setPer(pi,{cedula:e.target.value})} />
            <label className="nf-l">Teléfono <span className="nf-opt">(opcional)</span></label>
            <input className="inp" type="tel" placeholder="0999123456" value={p.tel} onChange={e=>setPer(pi,{tel:e.target.value})} />
            <label className="nf-l">Correo electrónico <span className="nf-opt">(opcional)</span></label>
            <input className="inp" type="email" placeholder="maria@email.com" value={p.correo||''} onChange={e=>setPer(pi,{correo:e.target.value})} />
            <div className="nf-hint">Se registrará en NexServ con su código al agendar.</div>
          </> : (!p.cliente_id ? <div className="cli-pick">
            <input className="inp" placeholder={clientas===null?'Cargando clientas…':'Buscar por nombre, código o teléfono…'} value={p.q||''} onChange={e=>setPer(pi,{q:e.target.value})} />
            {(p.q||'').trim().length>=2 && <div className="cli-results">
              {clientasFiltradas(p.q).slice(0,8).map(c=>
                <button key={c.codigo} className="cli-res" onClick={()=>pickCliente(pi,c)}>
                  <b>{c.nombre}{c.top?' ⭐':''}</b><span>{c.codigo}{c.telefono?(' · '+c.telefono):''}</span>
                </button>)}
              {clientasFiltradas(p.q).length===0 && <div className="cli-res-empty">Sin resultados para "{p.q}"</div>}
            </div>}
          </div> : (function(){ const c=p._cli||{}; const h=p.hist;
            const fac=(h&&h.fichas)?(h.fichas.facial||[]):[]; const pes=(h&&h.fichas)?(h.fichas.pestanas||[]):[]; const cej=(h&&h.fichas)?(h.fichas.cejas||[]):[];
            const FICHAS=[['facial','🧖 Ficha facial',fac,c.obs_facial],['pestanas','👁 Ficha pestañas',pes,c.obs_pestanas],['cejas','✏️ Ficha pigmento / cejas',cej,c.obs_cejas]];
            return <div className="cli-mini">
              <div className="cli-mini-nom">{c.nombre}{c.top&&<span className="cli-top sm">⭐</span>}<button className="cli-cambiar" onClick={()=>setPer(pi,{cliente_id:'',nombre:'',_cli:null,hist:null,q:'',open:''})}>cambiar</button></div>
              <div className="cli-mini-meta">Código {c.codigo}</div>
              <div className="cli-mini-stats"><span>Última visita<br/><b>{c.ultima_visita?fechaCorta(c.ultima_visita):'—'}</b></span><span>Total visitas<br/><b>{c.total_visitas||0}</b></span></div>
              <div className="cli-mini-lbl">Fichas</div>
              {h===null ? <div className="cli-res-empty">Cargando fichas…</div> :
               FICHAS.map(([key,label,items,obs])=>(
                <div key={key} className="ficha-acc">
                  <button className="ficha-accb" onClick={()=>setPer(pi,{open:p.open===key?'':key})}>
                    <span>{label}</span><span className="ficha-cnt">{items&&items.length?items.length:''} {p.open===key?'▴':'▾'}</span>
                  </button>
                  {p.open===key && <div className="ficha-body">
                    {obs?<div className="ficha-obs"><b>Obs. área:</b> {obs}</div>:null}
                    {(!items||!items.length) ? <div className="ficha-vacio">Sin ficha registrada.</div> : <FichaDetalle tipo={key} items={items}/>}
                  </div>}
                </div>
              ))}
              <div className="cli-mini-lbl">Observaciones</div>
              <div className="ficha-obs gen">{c.observaciones||'Sin observaciones registradas.'}</div>
            </div>;
          })())}
          {p.filas.map((f,fi)=>(
            <div className="srow" key={fi}>
              <div className="srow-h"><span>Servicio {fi+1}</span>{p.filas.length>1 && <button className="srow-x" onClick={()=>delFila(pi,fi)} aria-label="Quitar">×</button>}</div>
              <select className="sel" value={f.area} onChange={e=>setFila(pi,fi,{area:e.target.value,sid:''})}>
                <option value="">Área…</option>
                {areas.map(a=><option key={a.area} value={a.area}>{a.area}</option>)}
                <option value="__promo__">Promociones</option>
              </select>
              {f.area==='__promo__'
                ? <select className="sel" value={f.sid} onChange={e=>setFila(pi,fi,{sid:e.target.value})}>
                    <option value="">{promos===null?'Cargando promos…':((promos||[]).length?'Elige una promo…':'Sin promos esta semana')}</option>
                    {(promos||[]).map(pr=><option key={pr.numero} value={pr.numero}>#{pr.numero} · {pr.nombre} · {money(pr.precio)}</option>)}
                  </select>
                : <select className="sel" value={f.sid} disabled={!f.area} onChange={e=>setFila(pi,fi,{sid:e.target.value})}>
                    <option value="">{f.area?'Especifique…':'Elige área primero'}</option>
                    {servicios.filter(s=>s.area===f.area).map(s=><option key={s.id} value={s.id}>{s.servicio} · {money(s.precio)} · {s.duracion}min</option>)}
                  </select>}
              {f.area==='__promo__' && promoDe(f.sid) && (function(){ const pr=promoDe(f.sid); return <div className="promo-box">
                <div className="promo-t">Incluye</div>
                <div className="promo-inc">{pr.incluye}</div>
                <div className="promo-precio"><span className="promo-now">{money(pr.precio)}</span>{pr.regular>pr.precio?<span className="promo-reg">{money(pr.regular)}</span>:null}{pr.descuento>0?<span className="promo-off">-{pr.descuento}%</span>:null}</div>
                {pr.hasta?<div className="promo-vig">Vigente hasta {fechaCorta(pr.hasta)}</div>:null}
              </div>; })()}
            </div>
          ))}
          {p.filas.length<MAXSERV
            ? <button className="addx" onClick={()=>addFila(pi)}>+ Agregar servicio ({p.filas.length}/{MAXSERV})</button>
            : <div className="cap-note">Máximo {MAXSERV} servicios por persona</div>}
        </div>
      ))}

      <button className="addp" onClick={addPersona}>+ Agregar otra persona</button>

      {totalPrecio>0 && <div className="tot-line">Total estimado · {money(totalPrecio)}</div>}
      {aviso && <div className="aviso">{aviso}</div>}
      <button className="btn-prev" onClick={()=>{
        let svc=null, hayPromo=false;
        for(const p of personas){ for(const f of p.filas){
          if(f.area==='__promo__' && f.sid) hayPromo=true;
          if(f.area!=='__promo__' && f.sid && !svc) svc=svcPorId[f.sid];
        } }
        if(!svc) return setAviso(hayPromo
          ? 'La previsualización es solo para servicios por ahora (las promos no se previsualizan)'
          : 'Elige al menos un servicio para previsualizar los espacios');
        setAviso(''); setPreview(svc);
      }}>Previsualización · ver espacios</button>
      <button className="btn" disabled={enviando} onClick={agendar}>{enviando?(modoReserva==='ahora'?'Enviando…':'Agendando…'):(modoReserva==='ahora'?'Atender ahora':'Agendar cita')}</button>

      {preview && <Previsualizacion dia={dia} servicio={preview}
        onClose={()=>setPreview(null)}
        onConfirm={(h)=>{ setHora(h); setPreview(null); setAviso(''); }} />}
    </div>
  );
}

/* ---------- Permisos y bloqueos de staff ---------- */
function Permisos({go}){
  const [staff,setStaff]=useState(null);
  const [bloqueos,setBloqueos]=useState([]);
  const [openId,setOpenId]=useState(null);
  const [form,setForm]=useState({motivo:'Almuerzo',cuando:'diario',fecha:hoy(),ini:'13:00',fin:'14:00'});
  const [busy,setBusy]=useState(false);
  const [aviso,setAviso]=useState('');

  const cargar=async()=>{
    try{ const [s,b]=await Promise.all([apiGet('getStaff'),apiGet('getBloqueos')]);
      setStaff(s.ok?s.staff:[]); setBloqueos(b.ok?b.bloqueos:[]); }
    catch(e){ setStaff([]); setBloqueos([]); }
  };
  useEffect(()=>{cargar()},[]);

  const abrir=id=>{ setOpenId(openId===id?null:id); setForm({motivo:'Almuerzo',cuando:'diario',fecha:hoy(),ini:'13:00',fin:'14:00'}); setAviso(''); };
  const guardar=async(st)=>{
    if(form.ini>=form.fin) return setAviso('La hora de fin debe ser mayor');
    setBusy(true); setAviso('');
    const fecha = form.cuando==='diario'?'diario' : form.cuando==='hoy'?hoy() : form.fecha;
    try{ const r=await apiPost('crearBloqueo',{staff_id:st.id,staff_nombre:st.nombre,fecha,hora_inicio:form.ini,hora_fin:form.fin,motivo:form.motivo});
      if(r.ok){ setOpenId(null); cargar(); } else setAviso(r.error||'No se pudo guardar'); }
    catch(e){ setAviso('Error de conexión'); }
    setBusy(false);
  };
  const borrar=async(id)=>{ if(!confirm('¿Quitar este bloqueo?'))return; await apiPost('eliminarBloqueo',{id}); cargar(); };

  const blkDe=id=> bloqueos.filter(b=>b.staff_id===id);
  const fechaTxt=f=> f==='diario'?'Todos los días': fechaCorta(f);
  const porArea={}; (staff||[]).forEach(st=>{ (porArea[st.area]=porArea[st.area]||[]).push(st); });

  return (
    <div className="fade">
      <button className="back" onClick={()=>go('principal')}>‹ Volver</button>
      <div className="sec-title">Permisos y bloqueos</div>
      <div className="perm-intro">Bloquea el horario de una staff (almuerzo, permisos) y no se le asignarán citas en ese rango.</div>

      {staff===null ? <div className="spinner"></div> :
       staff.length===0 ? <div className="empty">No hay staff en la hoja Staff todavía.</div> :
       Object.keys(porArea).map(area=>(
         <div key={area} className="perm-area">
           <div className="perm-area-t">{area}</div>
           {porArea[area].map(st=>(
             <div key={st.id} className="perm-card">
               <div className="perm-head">
                 <div className="perm-name">{st.nombre||st.id}{!st.activo && <span className="perm-off">inactiva</span>}</div>
                 <button className="perm-add" onClick={()=>abrir(st.id)}>{openId===st.id?'Cancelar':'+ Bloqueo'}</button>
               </div>

               {blkDe(st.id).length>0 && <div className="perm-list">
                 {blkDe(st.id).map(b=>(
                   <div key={b.id} className="perm-blk">
                     <span className={"perm-tag "+(b.motivo==='Almuerzo'?'lunch':'perm')}>{b.motivo}</span>
                      <span className="perm-blk-t">{b.hora_inicio}–{b.hora_fin} · {fechaBonita(b.fecha)}</span>
                     <button className="perm-del" onClick={()=>borrar(b.id)} aria-label="Quitar">×</button>
                   </div>
                 ))}
               </div>}

               {openId===st.id && <div className="perm-form">
                 <div className="seg">
                   {['Almuerzo','Permiso'].map(m=><button key={m} className={"seg-b"+(form.motivo===m?' on':'')} onClick={()=>setForm({...form,motivo:m})}>{m}</button>)}
                 </div>
                 <div className="seg">
                   {[['diario','Todos los días'],['hoy','Hoy'],['fecha','Una fecha']].map(([k,l])=>
                     <button key={k} className={"seg-b"+(form.cuando===k?' on':'')} onClick={()=>setForm({...form,cuando:k})}>{l}</button>)}
                 </div>
                 {form.cuando==='fecha' && <input type="date" className="date-input" value={form.fecha} min={hoy()} onChange={e=>setForm({...form,fecha:e.target.value})} />}
                 <div className="grid2">
                   <div><label>Desde</label><input type="time" className="sel" value={form.ini} onChange={e=>setForm({...form,ini:e.target.value})} /></div>
                   <div><label>Hasta</label><input type="time" className="sel" value={form.fin} onChange={e=>setForm({...form,fin:e.target.value})} /></div>
                 </div>
                 {aviso && <div className="aviso">{aviso}</div>}
                 <button className="btn" disabled={busy} onClick={()=>guardar(st)}>{busy?'Guardando…':'Bloquear horario'}</button>
               </div>}
             </div>
           ))}
         </div>
       ))}
    </div>
  );
}

/* ---------- Recepción · Mikaela asigna staff cuando llega la clienta ---------- */
function Recepcion({go, servicios}){
  const [tickets,setTickets]=useState(null);
  const [edits,setEdits]=useState({});      // key -> [{area,sid}]
  const [estadoT,setEstadoT]=useState({});  // key -> 'busy'|'confirmado'|'cancelado'
  const [,setTick]=useState(0);
  const dia=hoy();
  const svcPorId={}; (servicios||[]).forEach(x=>{svcPorId[x.id]=x;});
  const areasUnicas=[...new Set((servicios||[]).map(s=>s.area).filter(Boolean))];

  const cargar=async()=>{
    try{ const r=await apiGet('getReservas',{fecha:dia});
      const list=(r.ok?r.reservas:[]).filter(c=>{const e=(c.estado||'').toLowerCase();return e!=='cancelada'&&e!=='no_show';});
      const map={};
      list.forEach(c=>{ const m=String(c.notas||'').match(/combo\s+(\S+)/i); const key=m?m[1]:c.id;
        if(!map[key]) map[key]={key,cliente_id:c.cliente_id,cliente_nombre:c.cliente_nombre,hora:c.hora_inicio,rows:[]};
        map[key].rows.push(c);
        if(String(c.hora_inicio||'')<String(map[key].hora||'')) map[key].hora=c.hora_inicio;
      });
      const ts=Object.values(map).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
      setTickets(ts);
      setEdits(prev=>{ const e={...prev}; ts.forEach(t=>{ if(!e[t.key]) e[t.key]=t.rows.map(r=>({area:r.area,sid:r.servicio_id})); }); return e; });
    }catch(e){ setTickets([]); }
  };
  useEffect(()=>{cargar()},[]);
  useEffect(()=>{ const t=setInterval(()=>setTick(x=>x+1),60000); return ()=>clearInterval(t); },[]);

  const pmin=t=>{const m=String(t).match(/(\d{1,2}):(\d{2})/);return m?(+m[1])*60+(+m[2]):null;};
  const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
  const esCodigo=v=>/^C-?\d+/i.test(String(v||''));
  const setSvc=(key,i,patch)=>setEdits(e=>({...e,[key]:e[key].map((f,j)=>j===i?{...f,...patch}:f)}));
  const addSvc=key=>setEdits(e=>({...e,[key]:[...(e[key]||[]),{area:'',sid:''}]}));
  const delSvc=(key,i)=>setEdits(e=>({...e,[key]:e[key].filter((_,j)=>j!==i)}));

  const [avisoT,setAvisoT]=useState({});

  const confirmar=async(t)=>{
    setAvisoT(a=>({...a,[t.key]:''}));
    setEstadoT(s=>({...s,[t.key]:'busy'}));
    try{
      // El ticket ya fue enviado a NexServ al agendar (Prelista). Aquí solo confirmamos en SYNA.
      await Promise.all(t.rows.map(rr=>apiPost('actualizarCita',{id:rr.id,estado:'confirmada'})));
      setEstadoT(s=>({...s,[t.key]:'confirmado'}));
    }catch(e){ setEstadoT(s=>({...s,[t.key]:''})); setAvisoT(a=>({...a,[t.key]:'Error de conexión, reintenta'})); }
  };
  const cancelar=async(t)=>{
    setEstadoT(s=>({...s,[t.key]:'busy'}));
    try{ await Promise.all(t.rows.map(r=>apiPost('cancelarReserva',{id:r.id})));
      setEstadoT(s=>({...s,[t.key]:'cancelado'})); }
    catch(e){ setEstadoT(s=>({...s,[t.key]:''})); }
  };

  return (
    <div className="fade">
      <button className="back" onClick={()=>go('principal')}>‹ Volver</button>
      <div className="sec-title">Recepción · tickets de hoy</div>
      <div className="perm-intro">Cada cita ya se envía sola a NexServ al agendarse (queda <b>Prelista</b>). Cuando la clienta llega, dale <b>Confirmar llegada</b>. Si no vino, <b>Cancelar ticket</b>. 💜</div>
      {tickets===null ? <div className="spinner"></div> :
       tickets.length===0 ? <div className="empty" style={{padding:'24px 0'}}>No hay tickets para hoy 🌿</div> :
       tickets.map(t=>{
         const ini=pmin(t.hora), n=nowMin();
         const llegando = ini!=null && n>=ini-15 && n<ini+60;
         const est=estadoT[t.key]||'';
         const svs=edits[t.key]||[];
         if(est==='confirmado') return <div key={t.key} className="rec-card done"><div className="rec-cli">{t.cliente_nombre}</div><div className="rec-hecho">✓ Llegada confirmada</div></div>;
         if(est==='cancelado') return <div key={t.key} className="rec-card cancd"><div className="rec-cli">{t.cliente_nombre}</div><div className="rec-hecho can">✕ Ticket cancelado</div></div>;
         return (
           <div key={t.key} className={"rec-card"+(llegando?' now':'')}>
             <div className="rec-top">
               <span className="rec-meta">{esCodigo(t.cliente_id)?(t.cliente_id+' · '):''}cita {t.hora}{llegando&&<b className="rec-now"> · es la hora</b>}</span>
               <span className="rec-prio">Normal</span>
             </div>
             <div className="rec-cli">{t.cliente_nombre||'—'}</div>
             <div className="rec-svlbl">Servicios (reconfirma si cambió)</div>
             {svs.map((f,i)=>(
               <div className="rec-sv" key={i}>
                 <select className="sel" value={f.area} onChange={e=>setSvc(t.key,i,{area:e.target.value,sid:''})}>
                   <option value="">Área…</option>
                   {areasUnicas.map(a=><option key={a} value={a}>{a}</option>)}
                 </select>
                 <select className="sel" value={f.sid} disabled={!f.area} onChange={e=>setSvc(t.key,i,{sid:e.target.value})}>
                   <option value="">{f.area?'Servicio…':'Elige área'}</option>
                   {(servicios||[]).filter(s=>s.area===f.area).map(s=><option key={s.id} value={s.id}>{s.servicio}</option>)}
                 </select>
                 {svs.length>1 && <button className="rec-svx" onClick={()=>delSvc(t.key,i)} aria-label="Quitar">×</button>}
               </div>
             ))}
             <button className="rec-addsv" onClick={()=>addSvc(t.key)}>+ Agregar servicio</button>
             <div className="rec-btns">
               <button className="rec-b ok" disabled={est==='busy'} onClick={()=>confirmar(t)}>{est==='busy'?'…':'✓ Confirmar llegada'}</button>
               <button className="rec-b can" disabled={est==='busy'} onClick={()=>cancelar(t)}>✕ Cancelar ticket</button>
             </div>
             {avisoT[t.key] && <div className="rec-aviso">⚠️ {avisoT[t.key]}</div>}
           </div>
         );
       })}
    </div>
  );
}

/* ---------- Render de fichas (facial / pestañas / pigmento) ---------- */
function FichaDetalle({tipo, items}){
  if(tipo==='facial') return items.map((f,i)=>(
    <div key={i} className="ficha-it">
      <b>{f.fecha?fechaCorta(f.fecha):''}</b>{' '}
      {[f.edad&&(f.edad+' años'), f.sexo, f.tipo_piel&&('Piel '+f.tipo_piel), f.fototipo&&('Fototipo '+f.fototipo)].filter(Boolean).join(' · ')}
      {f.notas?<div className="ficha-sub">{f.notas}</div>:null}
    </div>));
  if(tipo==='pestanas') return items.map((f,i)=>(
    <div key={i} className="ficha-it">
      <b>{f.fecha?fechaCorta(f.fecha):''}</b> · {f.estilo}{f.curvatura?(' · '+f.curvatura):''}{f.activa?' · activa':''}
      {f.observacion?<div className="ficha-sub">{f.observacion}</div>:null}
    </div>));
  return items.map((f,i)=>(
    <div key={i} className="ficha-it">
      <b>{f.fecha?fechaCorta(f.fecha):''}</b> · {f.sesion}{f.color?(' · '+f.color):''}{f.aguja?(' · aguja '+f.aguja):''}{f.responsable?(' · '+f.responsable):''}
      {f.proximo_retoque?<div className="ficha-sub">Próx. retoque: {fechaCorta(f.proximo_retoque)}</div>:null}
      {f.observaciones?<div className="ficha-sub">{f.observaciones}</div>:null}
    </div>));
}

/* ---------- Clientas · directorio + ficha + historial (NexServ) ---------- */
function Clientas({go}){
  const [lista,setLista]=useState(null);
  const [q,setQ]=useState('');
  const [sel,setSel]=useState(null);      // clienta seleccionada (objeto)
  const [hist,setHist]=useState(null);    // getHistorial result
  const [com,setCom]=useState(null);      // forma de comunicarse guardada en SYNA
  const [guardandoCom,setGuardandoCom]=useState(false);
  const [msgCom,setMsgCom]=useState('');
  const [cargandoH,setCargandoH]=useState(false);

  useEffect(()=>{ (async()=>{
    try{ const r=await apiGet('getClientes'); setLista(r.ok?(r.clientes||[]):[]); }
    catch(e){ setLista([]); }
  })(); },[]);

  const abrir=async(c)=>{
    setSel(c); setHist(null); setCom(null); setMsgCom(''); setCargandoH(true);
    try{
      const [r,rc]=await Promise.all([apiGet('getHistorial',{codigo:c.codigo}),apiGet('getComunicacionClienta',{codigo:c.codigo})]);
      setHist(r.ok?r:{visitas:[],fichas:{facial:[],pestanas:[]}});
      setCom((rc&&rc.ok&&rc.comunicacion)?{...rc.comunicacion,codigo:c.codigo,nombre:c.nombre}:{codigo:c.codigo,nombre:c.nombre,forma:'',preferencias:'',frases:'',evitar:''});
    }
    catch(e){ setHist({visitas:[],fichas:{facial:[],pestanas:[]}}); setCom({codigo:c.codigo,nombre:c.nombre,forma:'',preferencias:'',frases:'',evitar:''}); }
    setCargandoH(false);
  };
  const setComField=(k,v)=>setCom(c=>({...c,[k]:v,codigo:sel&&sel.codigo,nombre:sel&&sel.nombre}));
  const guardarCom=async()=>{ if(!sel||!com)return; setGuardandoCom(true); setMsgCom('');
    try{ const r=await apiPost('saveComunicacionClienta',{comunicacion:{...com,codigo:sel.codigo,nombre:sel.nombre}}); setMsgCom(r&&r.ok?'Forma de comunicarse guardada':'No se pudo guardar'); }
    catch(e){ setMsgCom('Error de conexión al guardar'); }
    setGuardandoCom(false); setTimeout(()=>setMsgCom(''),2200);
  };
  const copiarContexto=()=>{ if(!sel)return; const ult=(hist&&hist.visitas?hist.visitas:[]).slice(0,3).map(v=>`${v.fecha||''} · ${v.servicio||''}${v.staff?' · '+v.staff:''}`).join('\n'); const txt=[`Clienta: ${sel.nombre} (${sel.codigo})`,com&&com.forma?`Forma de comunicarse: ${com.forma}`:'',com&&com.preferencias?`Preferencias: ${com.preferencias}`:'',com&&com.frases?`Frases típicas: ${com.frases}`:'',ult?`Últimos servicios NexServ:\n${ult}`:''].filter(Boolean).join('\n'); try{ navigator.clipboard.writeText(txt); setMsgCom('Contexto copiado para Copiloto'); setTimeout(()=>setMsgCom(''),1600); }catch(e){ setMsgCom('No se pudo copiar'); } };

  const norm=s=>String(s||'').toLowerCase();
  const money=n=>'$'+Math.round(n||0);
  const filtradas=(lista||[]).filter(c=>{
    if(!q) return true; const t=norm(q);
    return norm(c.nombre).indexOf(t)>=0 || norm(c.codigo).indexOf(t)>=0 || norm(c.telefono).indexOf(t)>=0;
  });

  // ----- Ficha de una clienta -----
  if (sel){
    const obs=[['General',sel.observaciones],['Cejas',sel.obs_cejas],['Depilación',sel.obs_depilacion],['Pestañas',sel.obs_pestanas],['Facial',sel.obs_facial]].filter(x=>String(x[1]||'').trim());
    const v=hist&&hist.visitas?hist.visitas:[];
    const fFac=hist&&hist.fichas?(hist.fichas.facial||[]):[];
    const fPes=hist&&hist.fichas?(hist.fichas.pestanas||[]):[];
    const fCej=hist&&hist.fichas?(hist.fichas.cejas||[]):[];
    return (
      <div className="fade">
        <button className="back" onClick={()=>{setSel(null);setHist(null);setCom(null);}}>‹ Volver a clientas</button>
        <div className="cli-ficha-h">
          <div className="cli-ficha-nom">{sel.nombre}{sel.top&&<span className="cli-top">⭐ TOP</span>}</div>
          <div className="cli-ficha-meta">{sel.codigo}{sel.telefono?(' · '+sel.telefono):''}</div>
          {sel.correo?<div className="cli-ficha-meta">{sel.correo}</div>:null}
          <div className="cli-stats">
            <span><b>{sel.total_visitas}</b> visitas</span>
            {sel.ultima_visita?<span>última: {fechaCorta(sel.ultima_visita)}</span>:null}
          </div>
        </div>

        {obs.length>0 && <div className="cli-box">
          <div className="cli-box-t">Observaciones</div>
          {obs.map(([k,val])=><div key={k} className="cli-obs"><b>{k}:</b> {val}</div>)}
        </div>}

        <div className="cli-box">
          <div className="cli-box-t">Forma de comunicarse</div>
          <div className="promo-hint">Esto se guarda en SYNA por código de clienta. El historial de servicios sigue viniendo de NexServ.</div>
          {!com?<div className="spinner"></div>:<>
            <label className="nf-l">Tono/trato con esta clienta</label>
            <textarea className="inp" style={{minHeight:70,resize:'vertical'}} value={com.forma||''} onChange={e=>setComField('forma',e.target.value)} placeholder="Ej. Le gusta trato directo y cariñoso; responderle corto, sin demasiadas opciones." />
            <label className="nf-l">Preferencias conocidas</label>
            <textarea className="inp" style={{minHeight:70,resize:'vertical'}} value={com.preferencias||''} onChange={e=>setComField('preferencias',e.target.value)} placeholder="Ej. Prefiere sábados temprano, siempre pregunta por Rosa, suele reservar cejas + bozo." />
            <label className="nf-l">Frases o pedidos típicos</label>
            <textarea className="inp" style={{minHeight:70,resize:'vertical'}} value={com.frases||''} onChange={e=>setComField('frases',e.target.value)} placeholder="Ej. Cuando dice “lo mismo de siempre” se refiere al último combo registrado en NexServ." />
            <label className="nf-l">Evitar / cuidado al responder</label>
            <textarea className="inp" style={{minHeight:60,resize:'vertical'}} value={com.evitar||''} onChange={e=>setComField('evitar',e.target.value)} placeholder="Ej. No ofrecer horarios de tarde; no insistir con promos." />
            <div className="chips" style={{marginTop:8}}><button className="chip" onClick={guardarCom} disabled={guardandoCom}>{guardandoCom?'Guardando...':'Guardar comunicación'}</button><button className="chip" onClick={copiarContexto}>Copiar contexto</button></div>
            {msgCom?<div className="ok-msg" style={{marginTop:8}}>{msgCom}</div>:null}
          </>}
        </div>

        <div className="cli-sec">Historial de visitas</div>
        {cargandoH ? <div className="spinner"></div> :
         v.length===0 ? <div className="empty" style={{padding:'14px 0'}}>Sin visitas registradas.</div> :
         v.map((x,i)=>(
           <div key={i} className="cli-visita">
             <div className="cli-v-top"><span className="cli-v-srv">{x.servicio||'—'}</span><span className="cli-v-tot">{x.total?money(x.total):''}</span></div>
             <div className="cli-v-meta">{x.fecha?fechaCorta(x.fecha):''}{x.staff?(' · '+x.staff):''}{x.area?(' · '+x.area):''}{x.metodo?(' · '+x.metodo):''}</div>
           </div>
         ))}

        {fFac.length>0 && <>
          <div className="cli-sec">Ficha facial</div>
          <div className="cli-visita"><FichaDetalle tipo="facial" items={fFac}/></div>
        </>}

        {fPes.length>0 && <>
          <div className="cli-sec">Ficha pestañas</div>
          <div className="cli-visita"><FichaDetalle tipo="pestanas" items={fPes}/></div>
        </>}

        {fCej.length>0 && <>
          <div className="cli-sec">Ficha pigmento / cejas</div>
          <div className="cli-visita"><FichaDetalle tipo="cejas" items={fCej}/></div>
        </>}
      </div>
    );
  }

  // ----- Directorio -----
  return (
    <div className="fade">
      <div className="sec-title">Clientas</div>
      <input className="cli-search" placeholder="Buscar por nombre, código o teléfono…" value={q} onChange={e=>setQ(e.target.value)} />
      {lista===null ? <div className="spinner"></div> :
       <>
         <div className="cli-count">{filtradas.length} de {lista.length} clientas</div>
         {filtradas.slice(0,200).map(c=>(
           <button key={c.codigo} className="cli-row" onClick={()=>abrir(c)}>
             <div className="cli-row-l">
               <div className="cli-row-nom">{c.nombre||'—'}{c.top&&<span className="cli-top sm">⭐</span>}</div>
               <div className="cli-row-meta">{c.codigo}{c.telefono?(' · '+c.telefono):''}</div>
             </div>
             <div className="cli-row-r">{c.total_visitas?(c.total_visitas+' ✦'):''}</div>
           </button>
         ))}
         {filtradas.length>200 && <div className="cli-count">Mostrando 200 — afina la búsqueda para ver más.</div>}
       </>}
    </div>
  );
}

/* ---------- Swipe lateral (reagendar / eliminar) ---------- */
function SwipeRow({children,onReagendar,onEliminar}){
  const W=164;
  const [dx,setDx]=useState(0);
  const drag=React.useRef(false);
  const start=React.useRef(0);
  const moved=React.useRef(false);
  const down=e=>{ drag.current=true; moved.current=false; start.current=e.clientX-dx; try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){ } };
  const move=e=>{ if(!drag.current) return; let nx=e.clientX-start.current; if(Math.abs(nx-dx)>3) moved.current=true; nx=Math.max(-W,Math.min(0,nx)); setDx(nx); };
  const up=()=>{ if(!drag.current) return; drag.current=false; setDx(dx < -W/2 ? -W : 0); };
  const click=()=>{ if(!moved.current && dx<0) setDx(0); };
  return (
    <div className="swipe">
      <div className="swipe-actions">
        <button className="sw sw-reag" onClick={()=>{setDx(0);onReagendar();}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Reagendar</button>
        <button className="sw sw-elim" onClick={()=>{setDx(0);onEliminar();}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          Eliminar</button>
      </div>
      <div className="swipe-front" style={{transform:`translateX(${dx}px)`,transition:drag.current?'none':'transform .22s cubic-bezier(.2,.8,.2,1)'}}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onClick={click}>
        {children}
      </div>
    </div>
  );
}

/* ---------- Modal Reagendar ---------- */
function CitaSheet({cita,onClose,onReagendar,onEliminar,onActualizar}){
  const [abono,setAbono]=useState(cita.abono||'');
  const [busy,setBusy]=useState(false);
  const conf=(cita.estado||'').toLowerCase()==='confirmada';
  const enProceso=(cita.estado||'').toLowerCase()==='en_proceso';
  const act=async(patch)=>{ setBusy(true); try{ const r=await apiPost('actualizarCita',{id:cita.id,...patch}); if(r.ok) onActualizar(); }catch(e){} setBusy(false); };
  const adelantar=async()=>{ setBusy(true); try{ const r=await apiPost('confirmarLlegadaCita',{ids:[cita.id],nex:''}); if(r&&r.ok) onActualizar(); else alert('No se pudo adelantar la cita.'); }catch(e){ alert('Error de conexión.'); } setBusy(false); };
  return (
    <div className="sheet-ov" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="sheet-grip"></div>
        <div className="sheet-t">{cita.cliente_nombre||'—'}</div>
        <div className="sheet-sub">{(cita.svc?cita.svc.servicio:cita.servicio_id)} · {cita.hora_inicio}–{cita.hora_fin}</div>
        <span className={"sheet-badge "+(conf?'ok':'pend')}>{conf?'Confirmada':'Por confirmar'}</span>

        {!conf
          ? <button className="sheet-btn primary" disabled={busy} onClick={()=>act({estado:'confirmada'})}>✓ Confirmar asistencia</button>
          : <button className="sheet-btn" disabled={busy} onClick={()=>act({estado:'pendiente'})}>Marcar por confirmar</button>}

        {!enProceso && <button className="sheet-btn" disabled={busy} onClick={adelantar}>Enviar a NexServ ahora · llegó</button>}

        <div className="sheet-abono">
          <input className="inp" type="number" inputMode="decimal" placeholder="Abono $" value={abono} onChange={e=>setAbono(e.target.value)} />
          <button className="sheet-btn" disabled={busy} onClick={()=>act({abono:abono})}>Guardar abono</button>
        </div>

        <button className="sheet-btn" onClick={()=>onReagendar(cita)}>Reagendar</button>
        <button className="sheet-btn danger" onClick={()=>onEliminar(cita.id)}>Eliminar cita</button>
        <button className="sheet-btn ghost" onClick={onClose}>Cerrar</button>
      </div>
    </div>
  );
}

function ReagendarModal({reserva,servicios,colorArea,onClose,onDone}){
  const svc=servicios.find(x=>x.id===reserva.servicio_id);
  const [fecha,setFecha]=useState(reserva.fecha||hoy());
  const [slots,setSlots]=useState(null);
  const [hora,setHora]=useState(null);
  const [guardando,setGuardando]=useState(false);
  const [msg,setMsg]=useState('');
  const cargar=async(f)=>{ setSlots(null); setHora(null);
    try{ const r=await apiGet('getDisponibilidad',{servicio_id:reserva.servicio_id,fecha:f}); setSlots(r.ok?(r.slots||[]):[]); }
    catch(e){ setSlots([]); } };
  useEffect(()=>{cargar(fecha)},[]);
  const guardar=async()=>{
    if(!hora){ setMsg('Elige una hora'); return; }
    setGuardando(true); setMsg('');
    try{ const r=await apiPost('reagendarReserva',{id:reserva.id,nueva_fecha:fecha,nueva_hora:hora});
      if(r&&r.ok) onDone(); else setMsg((r&&r.error)||'No se pudo reagendar'); }
    catch(e){ setMsg('Error de conexión'); }
    setGuardando(false);
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">Reagendar<button className="modal-x" onClick={onClose}>×</button></div>
        <div className="muted" style={{fontSize:13,margin:'2px 0 14px'}}>{reserva.cliente_nombre||'—'} · {svc?svc.servicio:reserva.servicio_id}</div>
        <input type="date" className="date-input" value={fecha} onChange={e=>{setFecha(e.target.value);cargar(e.target.value);}} />
        {slots===null ? <div className="spinner"></div> :
         slots.length===0 ? <div className="empty" style={{padding:'22px 0'}}>Sin horarios disponibles ese día</div> :
         <div className="slots">{slots.map(h=>(
           <button key={h} className={"slot"+(hora===h?' on':'')} style={hora===h?{background:colorArea(reserva.area)}:null} onClick={()=>setHora(h)}>{h}</button>
         ))}</div>}
        {msg && <div style={{color:'#E5484D',fontSize:13,textAlign:'center',marginTop:10}}>{msg}</div>}
        <button className="btn" disabled={guardando||!hora} onClick={guardar}>{guardando?'Guardando…':'Confirmar nueva hora'}</button>
      </div>
    </div>
  );
}

/* ---------- Agenda / Calendario del mes ---------- */
function Agenda({servicios,colorArea}){
  const ahora=new Date();
  const [cur,setCur]=useState({y:ahora.getFullYear(),m:ahora.getMonth()});
  const [mesData,setMesData]=useState(null);
  const [sel,setSel]=useState(hoy());
  const [filtro,setFiltro]=useState('todos');
  const [reagendar,setReagendar]=useState(null);
  const [accion,setAccion]=useState(null);
  const [diaAbierto,setDiaAbierto]=useState(false);
  const [franja,setFranja]=useState('dia');
  const [horDia,setHorDia]=useState(null);
  const [colsCerradas,setColsCerradas]=useState({});
  const svcMap=useMemo(()=>{const m={};servicios.forEach(s=>m[s.id]=s);return m;},[servicios]);

  const pad2=n=>String(n).padStart(2,'0');
  const mesStr=`${cur.y}-${pad2(cur.m+1)}`;
  const cargarMes=async()=>{ setMesData(null);
    try{ const r=await apiGet('getReservasMes',{mes:mesStr}); setMesData(r.ok?r.reservas:[]); }catch(e){ setMesData([]); } };
  useEffect(()=>{cargarMes()},[cur.y,cur.m]);
  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getHorarioDia',{fecha:sel}); setHorDia(r.ok?r:null); }catch(e){ setHorDia(null); } })(); },[sel]);
  const cancelar=async(id)=>{ if(!confirm('¿Eliminar esta cita?'))return; await apiPost('cancelarReserva',{id}); cargarMes(); };

  const selEnMes=sel.slice(0,7)===mesStr;
  const data=useMemo(()=> (mesData||[]).filter(r=>r.fecha===sel), [mesData,sel]);
  const conCitas=useMemo(()=>{ const s={}; (mesData||[]).forEach(r=>{ const e=(r.estado||'').toLowerCase(); if(e!=='cancelada'&&e!=='no_show'){ const d=+r.fecha.slice(8,10); s[d]=(s[d]||0)+1; } }); return s; },[mesData]);

  const hoyStr=hoy();
  const pm=t=>{ const m=String(t).match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
  const hhmm=m=>{ const z=n=>(n<10?'0':'')+n; return z(Math.floor(m/60))+':'+z(m%60); };
  const money=n=>'$'+Math.round(n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

  // Horario del día desde backend; fallback local si la API no responde.
  const HOR={1:['09:00','19:00'],2:['09:00','19:00'],3:['09:00','19:00'],4:['09:00','19:00'],5:['09:00','19:00'],6:['08:00','17:00'],0:null};
  const dow=new Date(sel+'T12:00:00').getDay(); const hh=horDia ? (horDia.cerrado?null:[horDia.abre,horDia.cierra]) : HOR[dow]; const cerrado=!hh;
  const abre=hh?pm(hh[0]):540, cierra=hh?pm(hh[1]):1140, CORTE=13*60;

  const catDe=(svc)=>{ if(!svc)return 'normal';
    const a=(svc.area||'').toLowerCase(), g=(svc.grupo||'').toLowerCase(), n=(svc.servicio||'').toLowerCase(), p=+svc.precio||0;
    if(a==='facial')return 'facial';
    if(g.indexOf('retoque')>=0 || n.indexOf('retoque')===0)return 'retoque';
    if(g.indexOf('combo')>=0 || n.indexOf('combo')>=0 || n.indexOf('paquete')>=0)return 'combo';
    if(n.indexOf('neutraliz')>=0 || n.indexOf('correcc')>=0)return 'correccion';
    if(a==='pestañas' || g.indexOf('extensiones')>=0 || g.indexOf('permanente')>=0 || n.indexOf('volumen')>=0 || n.indexOf('hawaiano')>=0 || n.indexOf('mega')>=0 || n.indexOf('efecto polvo')>=0 || p>=50)return 'premium';
    return 'normal'; };

  const citas=useMemo(()=> (data||[])
    .filter(r=>{ const e=(r.estado||'').toLowerCase(); return e!=='no_show'; })
    .map(r=>{ const svc=svcMap[r.servicio_id]; const ini=pm(r.hora_inicio); let fin=pm(r.hora_fin);
      if(fin==null||fin<=ini) fin=ini+((svc&&svc.duracion)||30);
      return {...r, ini, fin, svc, precio:(svc&&+svc.precio)||0, cat:catDe(svc)}; })
    .filter(c=>c.ini!=null).sort((a,b)=>a.ini-b.ini), [data,svcMap]);

  const enBloque=(c,b0,b1)=> c.ini>=b0 && c.ini<b1;
  const mCitas=citas.filter(c=>enBloque(c,abre,CORTE));
  const tCitas=citas.filter(c=>enBloque(c,CORTE,cierra+1));
  const suma=arr=>arr.reduce((s,c)=>s+c.precio,0);
  const mVal=suma(mCitas), tVal=suma(tCitas), totVal=mVal+tVal;
  const premiumCount=citas.filter(c=>c.cat==='premium').length;

  const ocupado=(b0,b1)=>{ const iv=citas.map(c=>[Math.max(c.ini,b0),Math.min(c.fin,b1)]).filter(p=>p[1]>p[0]).sort((a,b)=>a[0]-b[0]);
    let cov=0,end=-1; iv.forEach(p=>{ const s=Math.max(p[0],end); if(p[1]>s)cov+=p[1]-s; end=Math.max(end,p[1]); });
    const span=b1-b0; return span>0?Math.min(100,Math.round(cov/span*100)):0; };
  const mOcc=ocupado(abre,CORTE), tOcc=ocupado(CORTE,cierra);
  const libresEn=(b0,b1)=>{ let n=0; for(let t=b0;t+15<=b1;t+=15){ if(!citas.some(c=>c.ini<t+15 && c.fin>t))n++; } return n; };
  const libresTot=libresEn(abre,CORTE)+libresEn(CORTE,cierra);

  const pasaFiltro=c=>{ if(filtro==='todos')return true;
    if(filtro==='premium')return c.cat==='premium';
    if(filtro==='retoques')return c.cat==='retoque';
    const a=(c.area||'').toLowerCase();
    if(filtro==='pestanas')return a==='pestañas';
    if(filtro==='cejas')return a==='cejas';
    if(filtro==='facial')return a==='facial';
    return true; };
  const filas=(b0,b1)=>{ const disp=citas.filter(c=>c.ini>=b0 && c.ini<b1 && pasaFiltro(c));
    if(filtro!=='todos') return disp.map(c=>({type:'cita',c}));
    let cur=b0; citas.forEach(c=>{ if(c.ini<b0 && c.fin>b0) cur=Math.max(cur,Math.min(c.fin,b1)); });
    const rows=[]; disp.forEach(c=>{ if(c.ini-cur>=15) rows.push({type:'libre',a:cur,b:c.ini}); rows.push({type:'cita',c}); cur=Math.max(cur,Math.min(c.fin,b1)); });
    if(b1-cur>=15) rows.push({type:'libre',a:cur,b:b1});
    return rows; };

  const filaCita=(c)=>(
    <SwipeRow key={c.id||`${c.fecha}-${c.hora_inicio}-${c.cliente_nombre}`} onReagendar={()=>setReagendar(c)} onEliminar={()=>cancelar(c.id)}>
      <div className={"ag-cita cat-"+c.cat} onClick={()=>setAccion(c)}>
        <div className="ag-time">{hhmm(c.ini)}<small>{hhmm(c.fin)}</small></div>
        <div className="ag-info">
          <div className="ag-cli">{c.cliente_nombre||'—'}</div>
          <div className="ag-srv">{c.svc?c.svc.servicio:c.servicio_id}</div>
        </div>
        {c.precio?<div className="ag-pric">{money(c.precio)}</div>:null}
      </div>
    </SwipeRow>
  );
  const renderFilas=rows=> rows.length===0
    ? <div className="ag-vacio">Sin citas</div>
    : rows.map((row,i)=> row.type==='libre'
        ? <div key={'l'+i} className="ag-libre"><span className="ag-libre-dot"></span>Libre · {hhmm(row.a)}–{hhmm(row.b)} <small>({row.b-row.a} min)</small></div>
        : filaCita(row.c));

  const FILTROS=[['todos','Todos'],['premium','✨ Premium'],['pestanas','Pestañas'],['cejas','Cejas'],['facial','Faciales'],['retoques','Retoques']];

  const fechaDe=d=>`${cur.y}-${pad2(cur.m+1)}-${pad2(d)}`;
  const primeroDow=new Date(cur.y,cur.m,1).getDay(); const off=(primeroDow===0?6:primeroDow-1);
  const diasMes=new Date(cur.y,cur.m+1,0).getDate();
  const celdas=[]; for(let i=0;i<off;i++)celdas.push(null); for(let d=1;d<=diasMes;d++)celdas.push(d);
  const cambiarMes=delta=>{let m=cur.m+delta,y=cur.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setCur({y,m});};

  // ---- Timeline por columnas, con tickets compactos ordenados por hora ----
  const franjaIni = (franja==='tarde')?CORTE:abre;
  const franjaFin = (franja==='manana')?CORTE:cierra;
  const PPM = (franja==='dia')?1.35:2.3;
  const baseHourH=60*PPM, ticketH=27;
  const horas=[]; for(let h=Math.ceil(franjaIni/60); h*60<=franjaFin; h++) horas.push(h);
  const hLbl=h=>{ const ap=h<12?'am':'pm'; let x=h%12; if(x===0)x=12; return x+ap; };
  const tipoDe=c=>{ const svc=c&&c.svc?c.svc:c; if(!svc)return 'cejas_short';
    const areaReserva=(c&&c.area?c.area:'').toLowerCase();
    const a=(areaReserva || svc.area || '').toLowerCase(), g=(svc.grupo||'').toLowerCase(), n=(svc.servicio||'').toLowerCase(), dur=+svc.duracion||30;
    if(g.indexOf('permanente')>=0 || n.indexOf('efecto polvo')>=0) return 'permanente';
    if(a==='facial') return 'facial';
    if(a==='pestañas') return 'pestanas';
    if(a==='depilaciones' || g.indexOf('depila')>=0 || n.indexOf('depila')>=0 || n.indexOf('bikini')>=0 || n.indexOf('axila')>=0) return 'depilacion';
    return dur>60?'cejas_long':'cejas_short'; };
  const colDe=c=>{ const t=tipoDe(c);
    return t==='permanente'?'Permanentes': t==='facial'?'Facial': t==='pestanas'?'Pestañas':'Cejas'; };
  const COLS=['Cejas','Facial','Pestañas','Permanentes'];
  const COLWASH={Cejas:'#EAF5EE',Facial:'#EAF1FA','Pestañas':'#FAF7E6',Permanentes:'#F6EFF8'};
  const TIPOCOL={ cejas_long:['#8DCBA6','#1F4D33'], cejas_short:['#C6E6D2','#2C5E40'], depilacion:['#ECC08A','#6E4410'],
    facial:['#AEC9E8','#234C7A'], pestanas:['#ECE08F','#6E6411'], permanente:['#D8BBE0','#5A3168'] };
  const LEYENDA=[['cejas_long','Cejas +1h'],['cejas_short','Cejas −1h'],['depilacion','Depil.'],['facial','Facial'],['pestanas','Pestañas'],['permanente','Perm.']];
  const estadoClase=c=>{ const e=(c.estado||'').toLowerCase();
    if(e==='completada') return 'lista';
    if(e==='en_proceso' || e==='confirmada') return 'proceso';
    if(e==='cancelada') return 'cancelada';
    if(e==='pendiente') return 'pendiente';
    return 'normal'; };
  const toggleCol=col=>setColsCerradas(m=>({...m,[col]:!m[col]}));
  const visiblesPorCol={};
  COLS.forEach(col=>{ visiblesPorCol[col]=citas.filter(c=>colDe(c)===col && c.ini>=franjaIni && c.ini<franjaFin && pasaFiltro(c)); });
  const horaBase=m=>Math.max(franjaIni,Math.floor(m/60)*60);
  const horaCounts={};
  horas.forEach(h=>{ horaCounts[h*60]=0; });
  COLS.forEach(col=>{
    const counts={};
    visiblesPorCol[col].forEach(c=>{ const hb=horaBase(c.ini); counts[hb]=(counts[hb]||0)+1; });
    Object.keys(counts).forEach(hb=>{ horaCounts[hb]=Math.max(horaCounts[hb]||0,counts[hb]); });
  });
  const hourTops={}, hourHeights={}; let acc=0;
  horas.forEach(h=>{ const hb=h*60; hourTops[hb]=acc; if(hb<franjaFin){ hourHeights[hb]=Math.max(baseHourH,(horaCounts[hb]||0)*ticketH+12); acc+=hourHeights[hb]; } });
  const tlH=Math.max(120,acc);
  const layoutLineas=list=>{ const usados={};
    const items=list.slice().sort((a,b)=>a.ini-b.ini||a.fin-b.fin||String(a.cliente_nombre||'').localeCompare(String(b.cliente_nombre||''))).map(c=>{
      const hb=horaBase(c.ini), idx=usados[hb]||0;
      usados[hb]=idx+1;
      return {...c,_top:(hourTops[hb]||0)+6+idx*ticketH};
    });
    return items;
  };
  const colLayouts={};
  COLS.forEach(col=>{ colLayouts[col]=layoutLineas(visiblesPorCol[col]); });

  return (
    <div className="fade">
      <div className="sec-title">Agenda</div>

      {!diaAbierto ?
        <div className="cal card">
          <div className="cal-head">
            <button className="cal-nav" onClick={()=>cambiarMes(-1)} aria-label="Mes anterior">‹</button>
            <div className="cal-mes">{MESES_L[cur.m]}{cur.y!==ahora.getFullYear()?(' '+cur.y):''}</div>
            <button className="cal-nav" onClick={()=>cambiarMes(1)} aria-label="Mes siguiente">›</button>
          </div>
          <div className="cal-dows">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((d,i)=><span key={i} className={"cal-dow"+(i===5?' sab':'')+(i===6?' dom':'')}>{d}</span>)}</div>
          <div className="cal-grid">
            {celdas.map((d,i)=>{ if(d===null)return <span key={i} className="cal-cell empty"></span>;
              const col=i%7,f=fechaDe(d); const cls="cal-cell"+(f===sel?' sel':'')+(f===hoyStr?' hoy':'')+(col===6?' dom':'')+(col===5?' sab':'');
              return <button key={i} className={cls} onClick={()=>{setSel(f);setFranja('dia');setDiaAbierto(true);}}><span className="cd">{d}</span><span className={"cdot"+(conCitas[d]?'':' ghost')}></span></button>; })}
          </div>
        </div>
      :
        <>
          <button className="back" onClick={()=>setDiaAbierto(false)}>‹ Volver al mes</button>
          <div className="sub" style={{textTransform:'capitalize',marginTop:2}}>{fechaLarga(sel)}</div>

          {mesData===null ? <div className="spinner"></div> :
           cerrado ? <div className="empty" style={{padding:'28px 0'}}>Domingo — no laboramos 🌙</div> :
           <>
             <div className="ag-resumen">{citas.length} citas · {money(totVal)} · {libresTot} libres</div>
             <div className="lg">
               {LEYENDA.map(([t,l])=><span key={t} className="lg-i"><i style={{background:TIPOCOL[t][0]}}></i>{l}</span>)}
             </div>
             <div className="franja-seg">
               {[['manana','Mañana'],['tarde','Tarde'],['dia','Todo el día']].map(([k,l])=>
                 <button key={k} className={"franja-b"+(franja===k?' on':'')} onClick={()=>setFranja(k)}>{l}</button>)}
             </div>
              <div className="tl-scroll">
                <div className="tl-inner" style={{minWidth:46+COLS.reduce((n,c)=>n+(colsCerradas[c]?104:156),0)}}>
                  <div className="tl-hdr">
                    <div className="tl-corner"></div>
                    {COLS.map(c=><button key={c} className={"tl-chead"+(colsCerradas[c]?' closed':'')} onClick={()=>toggleCol(c)} title={colsCerradas[c]?'Abrir columna':'Cerrar columna'}><span>{c}</span><b className="tl-toggle">{colsCerradas[c]?'◇':'◆'}</b></button>)}
                  </div>
                  <div className="tl-body" style={{height:tlH}}>
                    <div className="tl-gutter">
                      {horas.map(h=><div key={h} className="tl-hlabel" style={{top:hourTops[h*60]||0}}>{hLbl(h)}</div>)}
                    </div>
                    {COLS.map(col=>{
                      const cerrada=!!colsCerradas[col];
                      const colCitas=colLayouts[col]||[];
                      return <div key={col} className={"tl-col"+(cerrada?' closed':'')} style={{background:COLWASH[col]}}>
                        {horas.map(h=><div key={h} className="tl-line" style={{top:hourTops[h*60]||0}}></div>)}
                        {colCitas.map((c,i)=>{
                          const top=c._top;
                          const st=estadoClase(c), tp=tipoDe(c), activo=st==='proceso';
                          const serv=(c.svc && String(c.svc.area||'')===String(c.area||''))?c.svc.servicio:c.servicio_id;
                          const key=c.id||`${c.fecha}-${c.hora_inicio}-${c.cliente_nombre}-${i}`;
                          return (
                            <button key={key} className={"tl-pill tp-"+tp+" st-"+st} style={{top}} onClick={()=>setAccion(c)}>
                              <span className="tl-pill-t">{hhmm(c.ini)}</span>
                              <span className="tl-pill-c">{c.cliente_nombre||'—'}</span>
                              <span className="tl-pill-s">{serv}</span>
                              {activo && <span className="tl-dot"></span>}
                            </button>
                          );
                        })}
                      </div>
                    })}
                  </div>
                </div>
              </div>
              <div className="tl-hint">Toca una cita para confirmar, abonar o reagendar · ◆ contrae columna · ◇ abre columna</div>
           </>}
        </>
      }

      {accion && <CitaSheet cita={accion} onClose={()=>setAccion(null)}
        onReagendar={c=>{setAccion(null);setReagendar(c);}}
        onEliminar={id=>{setAccion(null);cancelar(id);}}
        onActualizar={()=>{setAccion(null);cargarMes();}} />}
      {reagendar && <ReagendarModal reserva={reagendar} servicios={servicios} colorArea={colorArea}
        onClose={()=>setReagendar(null)} onDone={()=>{setReagendar(null);cargarMes();}} />}
    </div>
  );
}

/* ---------- Copiloto SYNA (chat IA interno) ---------- */
const SUGERENCIAS = [
  'La clienta dice: quiero mis cejas mañana en la tarde',
  'Margareth quiere lo mismo de siempre mañana',
  'Clienta pregunta si hay espacio para pestañas el sábado',
  'Ayúdame a responder y agendar esta conversación'
];
function Asistente(){
  const [msgs,setMsgs]=useState([{role:'assistant',text:'Copiloto SYNA listo. Pega aquí lo que te escribió la clienta y te sugiero cómo responder/agendar. No agendo automáticamente: tú apruebas primero.'}]);
  const [input,setInput]=useState('');
  const [cargando,setCargando]=useState(false);
  const [copiado,setCopiado]=useState('');
  const [editIdx,setEditIdx]=useState(null);
  const [editTxt,setEditTxt]=useState('');
  const finRef = React.useRef(null);

  useEffect(()=>{ if(finRef.current) finRef.current.scrollIntoView({behavior:'smooth'}); },[msgs,cargando]);

  const enviar=async(txt)=>{
    const t=(typeof txt==='string'?txt:input).trim();
    if(!t||cargando) return;
    const nuevos=[...msgs,{role:'user',text:t}];
    setMsgs(nuevos); setInput(''); setCargando(true);
    try{
      const adaptacion=await (async()=>{ try{ const srv=await apiGet('getAdaptacionIA'); if(srv&&srv.ok&&srv.adaptacion&&!srv.vacio) return srv.adaptacion; }catch(_){ } try{ const rawTpl=JSON.parse(localStorage.getItem('syna_adapt_templates')||'[]'); return {
        tono:localStorage.getItem('syna_adapt_tono')||'',
        plantillas:rawTpl.map(t=>{ const ms=(t.mensajes||[]).filter(m=>String(m.text||'').trim()||m.image); return ms.length?{titulo:t.titulo,guia:t.guia,cliente:ms.filter(m=>m.role==='clienta').map(m=>m.text).join('\n'),respuesta:ms.filter(m=>m.role==='syna').map(m=>(m.text||'')+(m.image?' [enviar imagen]':'')).join('\n'),mensajes:ms.map(m=>({role:m.role,text:m.text||'',tieneImagen:!!m.image}))}:{...t}; }).filter(x=>x&&(x.respuesta||x.mensajes)).slice(0,10),
        rapidas:JSON.parse(localStorage.getItem('syna_quick_replies')||'[]').filter(Boolean).slice(0,30),
        patrones:JSON.parse(localStorage.getItem('syna_patrones_chat')||'[]').slice(-12),
        recursos:JSON.parse(localStorage.getItem('syna_adapt_recursos')||'{}')
      };}catch(e){return {};}})();
      const r=await apiPost('chat',{history:nuevos,modo:'copiloto',adaptacion});
      setMsgs(m=>[...m,{role:'assistant',text:r.reply||'(sin respuesta)'}]);
    }catch(e){ setMsgs(m=>[...m,{role:'assistant',text:'Ups, error de conexión. Intenta de nuevo.'}]); }
    setCargando(false);
  };
  const copiar=async(txt)=>{ try{ await navigator.clipboard.writeText(txt); setCopiado('Copiado'); setTimeout(()=>setCopiado(''),1200); }catch(e){ setCopiado('No se pudo copiar'); } };
  const patrones=()=>{ try{return JSON.parse(localStorage.getItem('syna_patrones_chat')||'[]')||[];}catch(e){return [];} };
  const guardarPatron=(idx,original,corregida)=>{ try{
    const entrada=msgs.slice(Math.max(0,idx-3),idx).map(m=>({role:m.role,text:m.text}));
    const patron={fecha:new Date().toISOString(),entrada,original,corregida};
    const arr=patrones(); arr.push(patron);
    localStorage.setItem('syna_patrones_chat',JSON.stringify(arr.slice(-100)));
    try{ apiPost('addPatronAdaptacionIA',{patron}); }catch(_){ }
  }catch(e){} };
  const abrirEditar=(idx,txt)=>{ setEditIdx(idx); setEditTxt(txt); };
  const cancelarEditar=()=>{ setEditIdx(null); setEditTxt(''); };
  const guardarEdicion=()=>{ const txt=editTxt.trim(); if(editIdx==null||!txt)return;
    setMsgs(ms=>ms.map((m,i)=>i===editIdx?{...m,text:txt,editada:true}:m));
    const original=(msgs[editIdx]&&msgs[editIdx].text)||''; guardarPatron(editIdx,original,txt);
    setCopiado('Patrón guardado'); setTimeout(()=>setCopiado(''),1400); cancelarEditar(); };

  return (
    <div className="fade chat-wrap">
      <div className="asis-head">
        <div className="asis-av">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg>
        </div>
        <div className="asis-meta">
          <div className="asis-name">Copiloto SYNA</div>
          <div className="asis-on">Modo revisión</div>
        </div>
      </div>
      <div className="perm-intro">Pega mensajes de clientas. SYNA propone respuesta y cita; tú decides si copias, editas o agendas manualmente.</div>

      <div className="chat-msgs">
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',alignItems:m.role==='assistant'?'flex-start':'flex-end'}}>
            {editIdx===i ? <div className="bubble bot" style={{width:'88%',padding:10}}>
              <textarea className="inp" style={{minHeight:120,resize:'vertical'}} value={editTxt} onChange={e=>setEditTxt(e.target.value)} />
              <div className="chips" style={{marginTop:8}}><button className="chip" onClick={guardarEdicion}>Guardar patrón</button><button className="chip" onClick={cancelarEditar}>Cancelar</button></div>
            </div> : <div className={"bubble "+(m.role==='assistant'?'bot':'me')}>{m.text}{m.editada?<div className="muted" style={{fontSize:11,marginTop:6}}>respuesta modificada · patrón guardado</div>:null}</div>}
            {m.role==='assistant' && i>0 && editIdx!==i && <div className="chips" style={{marginTop:6}}><button className="chip" onClick={()=>copiar(m.text)}>Copiar respuesta</button><button className="chip" onClick={()=>abrirEditar(i,m.text)}>Modificar respuesta</button></div>}
          </div>
        ))}
        {msgs.length===1 && !cargando &&
          <div className="chips">
            {SUGERENCIAS.map((s,i)=>(
              <button key={i} className="chip" onClick={()=>enviar(s)}>{s}</button>
            ))}
          </div>}
        {cargando && <div className="typing"><span></span><span></span><span></span></div>}
        {copiado && <div className="muted" style={{fontSize:12,marginTop:4}}>{copiado}</div>}
        <div ref={finRef}></div>
      </div>

      <div className="chatbar"><div className="chatbar-in">
        <input value={input} placeholder="Pega el mensaje de la clienta…"
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') enviar(); }} />
        <button className="send" disabled={cargando||!input.trim()} onClick={enviar} aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div></div>
    </div>
  );
}

/* ---------- Principal (dashboard) ---------- */
function Principal({rol,nombre,colorArea,go,asistenteOn}){
  const [d,setD]=useState(null);
  const [err,setErr]=useState('');
  const [openCard,setOpenCard]=useState('');
  const [actState,setActState]=useState({});   // key -> 'busy'|'done'|'incomplete'|'cancelled'
  const cargar=async()=>{
    try{ const r=await apiGet('getResumen'); if(r&&r.ok){setD(r);setErr('');} else setErr('No se pudo cargar el resumen.'); }
    catch(e){ setErr('Error de conexión.'); }
  };
  useEffect(()=>{cargar()},[]);
  const accionCita=async(p,tipo)=>{
    const key=p.grupo||(p.ids&&p.ids[0])||p.cliente;
    const action=tipo==='llego'?'confirmarLlegadaCita':tipo==='cancelar'?'cancelarCitaNex':tipo==='incompleta'?'incompletaCita':'atendidaCita';
    if(!(p.ids&&p.ids.length)){ alert('Esta cita no tiene ids; no se puede '+action+'.'); return; }
    setActState(s=>({...s,[key]:'busy'}));
    try{
      const r=await apiPost(action,{ids:p.ids||[],nex:p.nex||''});
      if(!r || r.ok!==true){
        console.warn('accionCita',action,'respuesta inesperada:',r);
        alert('No se pudo completar la acción.\n\n'+JSON.stringify(r));
        setActState(s=>({...s,[key]:''}));
        return;
      }
      setActState(s=>({...s,[key]:tipo==='cancelar'?'cancelled':tipo==='incompleta'?'incomplete':'done'}));
      setTimeout(cargar,1200);
    }catch(e){
      console.error('accionCita error:',e);
      alert('Error de conexión al ejecutar '+action+'.');
      setActState(s=>({...s,[key]:''}));
    }
  };
  const esCEO = (rol||'').toLowerCase()==='admin';
  if(err) return <div className="empty">{err}</div>;
  if(!d) return <div className="spinner"></div>;
  const fila = (p,i,live) => {
    const key=p.grupo||(p.ids&&p.ids[0])||(p.cliente+i);
    const st=actState[key]||'';
    const open=openCard===key;
    if(st==='done') return <div key={key} className="resv done-card"><span className="dc-ic ok">✓</span><div style={{flex:1,minWidth:0}}><div className="who">{p.cliente}</div><div className="what">{live?'Cliente lista':'Llegada confirmada'}</div></div></div>;
    if(st==='incomplete') return <div key={key} className="resv done-card"><span className="dc-ic" style={{color:'#B26A00',background:'#FFF4D8'}}>!</span><div style={{flex:1,minWidth:0}}><div className="who">{p.cliente}</div><div className="what">Terminada incompleta</div></div></div>;
    if(st==='cancelled') return <div key={key} className="resv done-card"><span className="dc-ic can">⊘</span><div style={{flex:1,minWidth:0}}><div className="who">{p.cliente}</div><div className="what">Cita cancelada</div></div></div>;
    return (
      <div key={key} className="resv-wrap">
        <div className={"resv"+(live?' enproc':'')+(open?' shift':'')} style={{borderLeftColor:colorArea(p.area)}} onClick={()=>setOpenCard(open?'':key)}>
          <div className="time">{p.hora_inicio}<small>{p.hora_fin}</small></div>
          <div style={{flex:1,minWidth:0}}>
            <div className="who">{p.cliente}</div>
            <div className="what">{p.servicio} · {p.area}{p.staff?(' · '+p.staff):''}</div>
          </div>
          {live && !open && <span className="live">●</span>}
        </div>
        <div className={"resv-acts"+(open?' show':'')}>
          {st==='busy' ? <span className="ra-load">…</span> : live
            ? <>
                <button className="ra warn" title="Terminada incompleta" onClick={()=>accionCita(p,'incompleta')}>!</button>
                <button className="ra ok" title="Cliente lista" onClick={()=>accionCita(p,'atendida')}>✓</button>
              </>
            : <>
                <button className="ra can" title="Cancelar cita" onClick={()=>accionCita(p,'cancelar')}>⊘</button>
                <button className="ra ok" title="Ya llegó a su cita" onClick={()=>accionCita(p,'llego')}>✓</button>
              </>}
        </div>
      </div>
    );
  };
  return (
    <div className="fade">
      <div className="sec-title">Hola{nombre?(', '+nombre.split(' ')[0]):''} 👋</div>
      <div className="muted" style={{margin:'-8px 2px 16px',fontSize:14}}>Semana {fechaCorta(d.semana.ini)} – {fechaCorta(d.semana.fin)}</div>

      <div className="hero">
        <div className="hcard h-week"><div className="hi">{IC.cWeek}</div><div className="hl">Citas Semana</div><div className="hn">{d.total}</div></div>
        <div className="hcard h-conf"><div className="hi">{IC.cConf}</div><div className="hl">Citas confirmadas</div><div className="hn">{d.confirmadas||0}</div></div>
        <div className="hcard h-pend"><div className="hi">{IC.cPend}</div><div className="hl">Sin confirmar</div><div className="hn">{d.pendientes||0}</div></div>
        <div className="hcard h-prox"><div className="hi">{IC.cProx}</div><div className="hl">Próximas a atender</div><div className="hn">{(d.proximas||[]).length}</div></div>
      </div>

      <div className="qa">
        <button className="qa-btn" onClick={()=>go('reservar')}>＋ Nueva reserva</button>
        {asistenteOn && <button className="qa-btn ghost" onClick={()=>go('asistente')}>✨ Copiloto</button>}
      </div>

      <div className="qa">
        <button className="qa-btn ghost" onClick={()=>go('calendario')}>Agenda</button>
      </div>

      <div className="stats">
        <div className="stat"><div className="n">{d.porRealizar}</div><div className="l">Por realizar</div></div>
        <div className="stat"><div className="n">{d.realizadas}</div><div className="l">Realizadas</div></div>
        <div className="stat"><div className="n">{d.total}</div><div className="l">Total semana</div></div>
      </div>

      <div className="sub">Citas por área</div>
      <div className="card areas-stat">
        {d.porArea.length===0 ? <div className="empty" style={{padding:'18px 0'}}>Sin citas esta semana</div> :
          d.porArea.map(a=>(
            <div key={a.area} className="arow">
              <span className="dot" style={{background:a.color}}></span>
              <span className="an">{a.area}</span>
              <span className="av">{a.n}</span>
            </div>
          ))}
      </div>

      <div className="muted" style={{textAlign:'center',fontSize:12.5,marginTop:26}}>SYNA organiza agenda y reservas. La espera, atención y cobro se manejan en NexServ.</div>
    </div>
  );
}

/* ---------- Laboratorio de tiempos y experiencia ---------- */
function Laboratorio(){
  const [lista,setLista]=useState(null), [q,setQ]=useState(''), [fecha,setFecha]=useState(''), [sel,setSel]=useState(null), [data,setData]=useState(null), [busy,setBusy]=useState(false), [err,setErr]=useState('');
  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getClientes'); setLista(r.ok?(r.clientes||[]):[]); }catch(e){ setLista([]); } })(); },[]);
  const norm=s=>String(s||'').toLowerCase();
  const money=n=>'$'+Math.round((Number(n)||0)*100)/100;
  const filtradas=(lista||[]).filter(c=>{ const t=norm(q); return !t || norm(c.nombre).indexOf(t)>=0 || norm(c.codigo).indexOf(t)>=0 || String(c.telefono||'').indexOf(t)>=0; }).slice(0,8);
  const buscar=async(c)=>{ const codigo=(c&&c.codigo)||q.trim(); if(!codigo)return; setSel(c||{codigo}); setBusy(true); setErr(''); setData(null);

    catch(e){ setErr(e&&e.message?e.message:'Error de conexión'); }

  };
  const nex=data&&data.nexserv&&data.nexserv.success?data.nexserv:null;
  const hist=data&&data.historial_syna&&data.historial_syna.ok?data.historial_syna:null;
  const reservas=(data&&data.reservas_syna)||[];

    <button className="btn" disabled={busy} onClick={()=>buscar(sel)}>{busy?'Buscando…':'Buscar laboratorio'}</button>
    {err&&<div className="aviso">{err}</div>}
    {data&&<>
      <div className="cli-ficha-h"><div className="cli-ficha-nom">{(hist&&hist.cliente&&hist.cliente.nombre)||(nex&&nex.visitas&&nex.visitas[0]&&nex.visitas[0].cliente)||data.codigo}</div><div className="cli-ficha-meta">{data.codigo}</div></div>
      <div className="stats"><div className="stat"><div className="n">{reservas.length}</div><div className="l">Agendas SYNA</div></div><div className="stat"><div className="n">{visitas.length}</div><div className="l">Visitas Lineas</div></div><div className="stat"><div className="n">{obs.length}</div><div className="l">Obs. staff</div></div></div>
