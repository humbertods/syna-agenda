<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F5F7" />
<title>SYNA · Agenda</title>
<link rel="icon" type="image/png" href="logo_icon_solo.png" />
<link rel="apple-touch-icon" href="logo_icon_solo.png" />

<!-- ============================================================= -->
<!--  CONFIG: si cambias el deploy del Apps Script, pega aquí       -->
<!--  la nueva URL que termina en /exec                            -->
<!-- ============================================================= -->
<script>
  window.SYNA_API = "https://script.google.com/macros/s/AKfycbxShQ8OsbaXajcaqI-D3_QWWszIkTvoi6b-R3UXqvjmirDCkfvY6rtm60ivXfDsnc8q/exec";
</script>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --bg:#E6E6EA; --panel:#F4F5F7; --surface:#FFFFFF; --ink:#1C1C1E; --soft:#8E8E93;
    --line:#E6E4DF; --line2:#D8D6D0;
    --cejas:#7CB342; --pestanas:#E8924B; --facial:#4A90D9;
    --brand:#5B3BC4; --brand-deep:#3A2280; --brand-soft:#EEE9FB;
    --shadow:0 1px 3px rgba(0,0,0,.05);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh}
  #app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--panel)}
  @media(min-width:520px){ #app{box-shadow:0 0 0 1px rgba(0,0,0,.03),0 16px 50px rgba(40,30,80,.18)} }
  .display{font-weight:700;letter-spacing:-.02em}

  header{padding:14px 18px 4px;display:flex;align-items:center;justify-content:flex-start}
  .logo{height:34px;width:auto;display:block}
  main{flex:1;padding:0 16px 110px;overflow-y:auto}

  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
  .sec-title{font-weight:700;font-size:26px;letter-spacing:-.02em;margin:8px 2px 14px}
  .muted{color:var(--soft)}

  /* listas agrupadas estilo iOS */
  .areas{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .area-btn{display:flex;align-items:center;gap:13px;padding:15px 16px;border:none;border-bottom:1px solid var(--line);
    background:none;cursor:pointer;text-align:left;width:100%;transition:background .12s ease}
  .area-btn:last-child{border-bottom:none}
  .area-btn:active{background:rgba(0,0,0,.04)}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .area-btn .name{font-size:17px;font-weight:500}
  .area-btn .sub{font-size:13px;color:var(--soft)}
  .area-btn .chev{margin-left:auto;color:#C4C4C7;font-size:20px}

  .search{width:100%;padding:11px 14px;border:none;border-radius:11px;background:rgba(118,118,128,.12);
    font-family:inherit;font-size:16px;color:var(--ink);outline:none}
  .list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-top:12px;box-shadow:var(--shadow)}
  .svc{display:flex;align-items:center;gap:12px;padding:13px 16px;border:none;border-bottom:1px solid var(--line);
    background:none;cursor:pointer;transition:background .12s ease}
  .svc:last-child{border-bottom:none}
  .svc:active{background:rgba(0,0,0,.04)}
  .svc .info{flex:1;min-width:0;text-align:left}
  .svc .nm{display:block;font-size:16px;font-weight:400;line-height:1.3}
  .svc .meta{display:block;font-size:13px;color:var(--soft);margin-top:1px}
  .svc .price{font-weight:600;font-size:16px;white-space:nowrap}

  .date-input{width:100%;padding:13px 14px;border:none;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);
    font-family:inherit;font-size:16px;color:var(--ink);outline:none}

  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .slot{padding:11px 0;border:none;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);
    font-family:inherit;font-size:15px;font-weight:500;color:var(--brand);cursor:pointer;text-align:center;transition:transform .12s ease}
  .slot:active{transform:scale(.95)}
  .slot.on{color:#fff!important}

  label{display:block;font-size:13px;color:var(--soft);margin:16px 4px 6px}
  .inp{width:100%;padding:13px 14px;border:none;border-radius:11px;background:var(--surface);box-shadow:var(--shadow);
    font-family:inherit;font-size:16px;color:var(--ink);outline:none}

  .btn{width:100%;padding:15px;border:none;border-radius:13px;background:var(--brand);color:#fff;
    font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:opacity .15s ease,transform .12s ease;margin-top:20px}
  .btn:active{transform:scale(.99);opacity:.9}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:transparent;color:var(--brand);box-shadow:none}

  .back{display:inline-flex;align-items:center;gap:3px;background:none;border:none;color:var(--brand);
    font-family:inherit;font-size:16px;cursor:pointer;padding:8px 2px;margin-bottom:2px}

  .summary{padding:4px 16px;border-radius:var(--radius)}
  .summary .row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:16px;border-bottom:1px solid var(--line)}
  .summary .row:last-child{border-bottom:none}
  .summary .k{color:var(--soft)}

  .resv{display:flex;gap:13px;padding:14px 16px;border-radius:14px;border-left:4px solid;
    background:var(--surface);box-shadow:var(--shadow);margin-top:10px}
  .resv .time{font-weight:600;font-size:15px;white-space:nowrap}
  .resv .time small{display:block;font-weight:400;color:var(--soft);font-size:12px}
  .resv .who{font-size:16px;font-weight:500}
  .resv .what{font-size:13px;color:var(--soft);margin-top:1px}
  .badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .x{margin-left:auto;background:none;border:none;color:#C4C4C7;font-size:22px;cursor:pointer;align-self:flex-start;line-height:1}

  .empty{text-align:center;color:var(--soft);padding:48px 20px;font-size:15px}

  /* boton salir en header */
  #app header{justify-content:space-between}
  .logout{background:none;border:none;color:var(--soft);cursor:pointer;padding:6px;display:flex;align-items:center}
  .logout svg{width:22px;height:22px}
  .menu-wrap{position:relative}
  .menu-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:17px;
    background:linear-gradient(135deg,#6B46D6,#9173E6);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(91,59,196,.35)}
  .menu-btn:active{transform:scale(.94)}
  .menu-ov{position:fixed;inset:0;z-index:18}
  .menu-pop{position:absolute;top:48px;right:0;z-index:19;min-width:226px;background:var(--surface);border-radius:16px;
    border:.5px solid rgba(0,0,0,.06);box-shadow:0 12px 32px rgba(40,30,80,.2);padding:6px;animation:fade .15s ease}
  .menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;font-size:15px;color:var(--ink)}
  .menu-sep{height:1px;background:var(--line);margin:2px 8px}
  .menu-item{width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:15px;color:#E5484D;padding:12px;cursor:pointer;border-radius:10px}
  .menu-item:active{background:rgba(0,0,0,.05)}
  .sw-toggle{flex:0 0 auto;width:46px;height:28px;border-radius:16px;border:none;background:#D6D4CE;cursor:pointer;position:relative;transition:background .2s ease}
  .sw-toggle.on{background:#34C759}
  .sw-knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s ease}
  .sw-toggle.on .sw-knob{transform:translateX(18px)}

  /* pantalla de login */
  .login{min-height:100dvh;background:var(--panel);display:flex;flex-direction:column;justify-content:flex-start;
    padding:36px 28px calc(26px + env(safe-area-inset-bottom));position:relative}
  .login-in{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;width:100%;max-width:340px;margin:0 auto;padding-top:5vh}
  .login-top{display:flex;flex-direction:column}
  .login-bottom{margin-top:auto;padding-top:24px}
  .login .lg{width:260px;height:auto;align-self:center;margin-bottom:40px;position:relative;z-index:1}
  .login .field{margin-bottom:12px}
  .login .field label{margin:0 0 6px 4px}
  .login .err{color:#D7263D;font-size:13.5px;text-align:center;margin-top:12px}
  .login .desc{text-align:center;color:var(--soft);font-size:13.5px;line-height:1.55;margin:26px 6px 0}
  .login .dev{text-align:center;margin-top:34px}
  .login .dev .by{font-size:10px;letter-spacing:1.6px;color:var(--soft);text-transform:uppercase}
  .login .dev .co{font-size:14px;font-weight:700;color:var(--brand-deep);letter-spacing:.6px;margin-top:3px}

  /* dashboard principal */
  .qa{display:flex;gap:10px;margin-bottom:16px}
  .qa-btn{flex:1;padding:13px;border:none;border-radius:13px;background:var(--brand);color:#fff;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
  .qa-btn:active{opacity:.9}
  .qa-btn.ghost{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 8px;text-align:center}
  .stat .n{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--brand-deep);line-height:1}
  .stat .l{font-size:11.5px;color:var(--soft);margin-top:5px}
  .sub{font-size:14px;font-weight:600;color:var(--ink);margin:22px 2px 10px}
  .areas-stat{padding:2px 16px}
  .arow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .arow:last-child{border-bottom:none}
  .arow .an{flex:1;font-size:16px}
  .arow .av{font-weight:700;font-size:17px;color:var(--brand-deep)}
  .resv.enproc{box-shadow:0 0 0 1.5px rgba(91,59,196,.18),var(--shadow)}
  .live{color:#34C759;font-size:11px;align-self:flex-start;margin-top:3px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stub{padding:30px 22px;text-align:center;margin-top:8px}
  .stub-ic{font-size:30px;margin-bottom:8px}
  .stub p{font-size:14.5px;line-height:1.5;margin:8px 0;color:var(--ink)}
  .stub p.muted{color:var(--soft);font-size:13px}

  /* tarjetas hero (resumen) */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .hcard{border-radius:22px;padding:18px 12px 20px;text-align:center;box-shadow:var(--shadow)}
  .hcard .hi{display:flex;justify-content:center;color:var(--ink);margin-bottom:7px}
  .hcard .hi svg{width:27px;height:27px}
  .hcard .hl{font-size:13.5px;font-weight:500;color:#3A3A3D;line-height:1.2}
  .hcard .hn{font-size:42px;font-weight:800;letter-spacing:-.03em;color:var(--brand-deep);line-height:1.05;margin-top:4px}
  .h-week{background:#FBF1E2}
  .h-conf{background:#E7F1E2}
  .h-pend{background:#EEEAFB}
  .h-prox{background:#FFFFFF}

  /* calendario mensual */
  .cal{padding:12px 12px 14px;margin-top:4px}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0 12px}
  .cal-nav{background:none;border:none;color:var(--brand);font-size:28px;line-height:1;cursor:pointer;width:40px;height:40px;border-radius:50%}
  .cal-nav:active{background:var(--brand-soft)}
  .cal-mes{font-size:23px;font-weight:700;letter-spacing:-.01em;text-align:center;min-width:130px}
  .cal-dows{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);padding-top:10px;margin-bottom:2px}
  .cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--soft)}
  .cal-dow.sab{color:#E8924B}
  .cal-dow.dom{color:#9173E6}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-cell{aspect-ratio:1/1.04;background:none;border:none;border-radius:13px;cursor:pointer;padding:0;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .12s ease}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell .cd{font-size:16px;font-weight:600;color:var(--ink);line-height:1}
  .cal-cell .cdot{width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .cal-cell .cdot.ghost{background:transparent}
  .cal-cell.sab .cd{color:#E8924B}
  .cal-cell.dom{background:#F1EFF5}
  .cal-cell.dom .cd{color:#B8B3C6}
  .cal-cell.hoy{box-shadow:inset 0 0 0 1.6px var(--brand)}
  .cal-cell.sel{background:var(--brand)}
  .cal-cell.sel .cd{color:#fff}
  .cal-cell.sel .cdot{background:#fff}
  .cal-cell:not(.sel):active{background:var(--brand-soft)}

  /* menú flotante (dock) */
  nav.dock{background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:0 0 calc(14px + env(safe-area-inset-bottom));pointer-events:none}
  .dock-in{pointer-events:auto;max-width:400px;width:calc(100% - 28px);margin:0 14px;display:flex;align-items:center;
    background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border:.5px solid rgba(0,0,0,.06);border-radius:26px;box-shadow:0 8px 26px rgba(46,26,107,.16);padding:8px}
  .dk{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 0;color:var(--soft);font-family:inherit;font-size:10px;font-weight:500}
  .dk svg{width:23px;height:23px}
  .dk.on{color:var(--brand)}
  .dk-refresh{flex:0 0 auto;width:52px;height:52px;margin:-18px 6px 0;border:none;border-radius:50%;
    background:var(--brand);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(91,59,196,.45);transition:transform .2s ease}
  .dk-refresh:active{transform:scale(.92)}
  .dk-refresh svg{width:24px;height:24px}
  .dk-refresh.spin svg{animation:spin .7s linear infinite}

  /* swipe lateral (reagendar / eliminar) */
  .swipe{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .swipe .resv{margin-top:0;box-shadow:none;border-radius:0}
  .swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex}
  .sw{border:none;color:#fff;font-family:inherit;font-size:11.5px;font-weight:600;width:82px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
  .sw svg{width:20px;height:20px}
  .sw-reag{background:var(--brand)}
  .sw-elim{background:#E5484D}
  .swipe-front{position:relative;background:var(--surface);will-change:transform;touch-action:pan-y;user-select:none}

  /* modal hoja inferior */
  .modal-bg{position:fixed;inset:0;z-index:20;background:rgba(20,16,40,.42);
    display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
  .modal{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:18px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(0,0,0,.2);
    animation:up .26s cubic-bezier(.2,.8,.2,1);max-height:86dvh;overflow-y:auto}
  @keyframes up{from{transform:translateY(50px);opacity:.5}to{transform:none;opacity:1}}
  .modal-h{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .modal-x{background:none;border:none;font-size:26px;line-height:1;color:var(--soft);cursor:pointer;padding:0 4px}

  /* chat estilo Mensajes */
  .chat-wrap{display:flex;flex-direction:column}
  .asis-head{display:flex;align-items:center;gap:11px;padding:2px 2px 14px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .asis-av{width:42px;height:42px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#6B46D6,#9173E6);color:#fff;box-shadow:0 4px 12px rgba(91,59,196,.35)}
  .asis-av svg{width:23px;height:23px}
  .asis-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .asis-on{font-size:12px;color:#34C759;display:flex;align-items:center;gap:5px;margin-top:1px}
  .asis-on::before{content:"";width:7px;height:7px;border-radius:50%;background:#34C759}
  .chat-msgs{display:flex;flex-direction:column;gap:8px;padding:4px 0 90px}
  .bubble{max-width:82%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.38;white-space:pre-wrap}
  .bubble.bot{align-self:flex-start;background:#ECEBF0;color:#1C1C1E;border-bottom-left-radius:6px}
  .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;padding-left:2px}
  .chip{background:var(--brand-soft);border:none;color:var(--brand-deep);border-radius:18px;padding:9px 14px;
    font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:transform .12s ease}
  .chip:active{transform:scale(.96)}
  .typing{align-self:flex-start;display:flex;gap:4px;background:#ECEBF0;border-radius:20px;border-bottom-left-radius:6px;padding:13px 14px}
  .typing span{width:7px;height:7px;border-radius:50%;background:#9A99A0;animation:blink 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  .chatbar{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:6}
  .chatbar::before{content:"";position:absolute;left:0;right:0;top:-26px;height:26px;pointer-events:none;
    background:linear-gradient(to top,var(--panel),rgba(244,245,247,0))}
  .chatbar-in{max-width:480px;width:100%;display:flex;align-items:center;gap:9px;background:var(--panel);padding:9px 0 10px}
  .chatbar input{flex:1;padding:13px 18px;border:1px solid var(--line2);border-radius:24px;background:var(--surface);font-family:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s ease}
  .chatbar input:focus{border-color:var(--brand)}
  .chatbar .send{flex:0 0 auto;width:46px;height:46px;border:none;border-radius:50%;background:var(--brand);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(91,59,196,.4);transition:transform .15s ease,opacity .15s ease}
  .chatbar .send svg{width:21px;height:21px}
  .chatbar .send:active{transform:scale(.92)}
  .chatbar .send:disabled{opacity:.45;box-shadow:none}
  .ok-circle{width:72px;height:72px;border-radius:50%;background:var(--cejas);display:flex;align-items:center;justify-content:center;margin:24px auto 10px}

  /* tab bar translucida */
  nav{position:fixed;bottom:0;left:0;right:0;background:rgba(244,242,238,.82);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--line);padding:7px 0 calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .tabwrap{max-width:480px;width:100%;display:flex}
  .tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px;color:var(--soft);font-family:inherit;font-size:10.5px;font-weight:500}
  .tab.on{color:var(--brand)}
  .tab svg{width:25px;height:25px}

  .spinner{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--brand);border-radius:50%;
    animation:spin .7s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- Agenda operativa (día) ---- */
  .day-nav{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
  .day-arrow{width:36px;height:40px;flex:0 0 auto;border:none;border-radius:12px;background:var(--surface);color:var(--brand);
    font-size:22px;cursor:pointer;box-shadow:0 1px 4px rgba(40,30,80,.06)}
  .day-arrow:active{transform:scale(.94)}
  .day-label{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
    background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:0 1px 4px rgba(40,30,80,.06)}
  .day-name{font-weight:700;font-size:15px;color:var(--ink);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day-cal{font-size:13px;opacity:.55}
  .hoy-btn{display:block;margin:8px auto 0;background:none;border:none;color:var(--brand);font-weight:700;font-size:13px;cursor:pointer}

  .ag-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 10px}
  .ag-m{background:var(--surface);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 1px 4px rgba(40,30,80,.06)}
  .ag-m.tot{background:linear-gradient(135deg,#6B46D6,#9173E6);color:#fff}
  .ag-m-t{font-size:11px;letter-spacing:.4px;text-transform:uppercase;opacity:.7;font-weight:600}
  .ag-m.tot .ag-m-t{opacity:.85}
  .ag-m-n{font-size:21px;font-weight:800;line-height:1.15;margin-top:2px}
  .ag-m-v{font-size:12.5px;font-weight:700;color:var(--brand)}
  .ag-m.tot .ag-m-v{color:#fff}

  .occ.card{padding:12px 14px;margin-bottom:12px}
  .occ-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .occ-lbl{width:58px;flex:0 0 auto;font-size:12px;font-weight:600;color:var(--soft)}
  .occ-bar{flex:1;height:11px;background:#E7E5DF;border-radius:7px;overflow:hidden}
  .occ-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#6B46D6,#9173E6);transition:width .4s ease}
  .occ-fill.tarde{background:linear-gradient(90deg,#E0922F,#F0B45E)}
  .occ-pct{width:40px;flex:0 0 auto;text-align:right;font-size:12.5px;font-weight:700;color:var(--ink)}
  .occ-stats{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);
    font-size:12px;font-weight:600;color:var(--soft);flex-wrap:wrap}

  .ag-filtros{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
  .ag-fchip{padding:6px 13px;border-radius:999px;border:.5px solid var(--line2);background:var(--surface);
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .ag-fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}

  .ag-block{margin-top:18px}
  .ag-block.tarde{margin-top:26px;padding-top:18px;border-top:2px dashed var(--line2)}
  .ag-block-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px 8px;
    font-size:13px;letter-spacing:1.5px;font-weight:800;color:var(--ink);text-transform:uppercase;border-bottom:2px solid var(--ink);margin-bottom:10px}
  .ag-block.tarde .ag-block-h{border-bottom-color:#E0922F;color:#B96E16}
  .ag-block-sub{font-size:11px;letter-spacing:.3px;font-weight:600;color:var(--soft);text-transform:none}
  .ag-vacio{color:var(--soft);font-size:13px;padding:8px 4px}

  .ag-cita{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:12px;padding:10px 13px;margin-top:8px;
    border-left:4px solid #C9C6BD;box-shadow:0 1px 4px rgba(40,30,80,.07)}
  .ag-time{flex:0 0 auto;width:48px;font-weight:700;font-size:14px;color:var(--ink);line-height:1.1}
  .ag-time small{display:block;font-size:10.5px;font-weight:500;color:var(--soft)}
  .ag-info{flex:1;min-width:0}
  .ag-cli{font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ag-srv{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ag-pric{flex:0 0 auto;font-weight:800;font-size:13px;color:var(--ink)}
  .ag-cita.cat-premium{background:#FFF8DC;border-left-color:#E0A100}
  .ag-cita.cat-premium .ag-cli{font-weight:800}
  .ag-cita.cat-premium .ag-pric{color:#9A6E00}
  .ag-cita.cat-combo{background:#FFE8D4;border-left-color:#E27B2C}
  .ag-cita.cat-correccion{background:#FCE3EC;border-left-color:#D6457E}
  .ag-cita.cat-facial{background:#E4EFFB;border-left-color:#3D7DCB}
  .ag-cita.cat-retoque{background:#E7F3DF;border-left-color:#5DA02E}

  .ag-libre{display:flex;align-items:center;gap:9px;margin-top:8px;padding:9px 13px;border-radius:12px;
    background:#ECF6E1;border:1.5px dashed #9CC97A;color:#4C7A1F;font-size:13px;font-weight:600}
  .ag-libre small{font-weight:500;color:#6E9A45}
  .ag-libre-dot{width:9px;height:9px;border-radius:50%;background:#69B021;flex:0 0 auto}

  /* ---- Agenda timeline por columnas ---- */
  .ag-resumen{font-size:13px;font-weight:600;color:var(--soft);margin:2px 2px 10px}
  .lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 2px 12px}
  .lg-i{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--soft);font-weight:600}
  .lg-i i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .tl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;background:var(--surface);
    box-shadow:0 1px 4px rgba(40,30,80,.07);padding-bottom:4px}
  .tl-inner{position:relative}
  .tl-hdr{display:flex;border-bottom:1px solid var(--line)}
  .tl-corner{width:46px;flex:0 0 auto}
  .tl-chead{width:156px;flex:0 0 auto;text-align:center;font-size:11.5px;font-weight:800;letter-spacing:.4px;
    color:var(--ink);text-transform:uppercase;padding:9px 4px}
  .tl-body{display:flex;position:relative}
  .tl-gutter{width:46px;flex:0 0 auto;position:relative}
  .tl-hlabel{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--soft);font-weight:600;white-space:nowrap}
  .tl-col{width:156px;flex:0 0 auto;position:relative;border-left:1px solid var(--line)}
  .tl-line{position:absolute;left:0;right:0;height:1px;background:rgba(0,0,0,.045)}
  .tl-pill{position:absolute;left:4px;right:4px;border:none;border-radius:9px;padding:4px 7px;text-align:left;cursor:pointer;
    overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.13);font-family:inherit;display:flex;flex-direction:column;justify-content:center;gap:1px}
  .tl-pill:active{transform:scale(.985)}
  .tl-pill-t{font-size:11px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-pill-s{font-size:10.5px;font-weight:500;opacity:.85;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-hint{font-size:11.5px;color:var(--soft);text-align:center;margin-top:10px}

  /* ---- Agendar (multi-servicio) ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .sel{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px;font-family:inherit;font-size:15px;
    background:var(--surface);color:var(--ink)}
  .sel:disabled{opacity:.5}
  .seg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .seg-b{padding:8px 13px;border-radius:999px;border:.5px solid var(--line2);background:var(--surface);
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .seg-b.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .srow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;
    display:flex;flex-direction:column;gap:8px}
  .srow-h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;
    color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
  .srow-x{background:none;border:none;font-size:21px;line-height:1;color:var(--soft);cursor:pointer;padding:0 2px}
  .addx{width:100%;background:#1A1726;color:#fff;border:none;border-radius:14px;padding:14px;font-family:inherit;
    font-size:15px;font-weight:700;cursor:pointer;margin-bottom:6px}
  .addx:active{opacity:.85}
  .promo-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
  .promo-t{font-size:11.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .promo-chip{display:inline-block;background:#F0EEF8;color:var(--brand-deep);border-radius:999px;padding:5px 11px;
    font-size:12.5px;font-weight:600;margin:0 6px 6px 0}
  .tot-line{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin:14px 0 2px}
  .aviso{color:#A32D2D;font-size:14px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const API = window.SYNA_API;

/* ---------- API helpers ---------- */
async function apiGet(action, params={}){
  const qs = new URLSearchParams({action, ...params}).toString();
  const r = await fetch(`${API}?${qs}`);
  return r.json();
}
async function apiPost(action, params={}){
  const r = await fetch(API, {method:'POST', body: JSON.stringify({action, ...params})});
  return r.json();
}

/* ---------- utilidades ---------- */
const hoy = () => { const d=new Date(); const z=n=>(n<10?'0':'')+n; return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fechaBonita(f){ const m=f.match(/(\d{4})-(\d{2})-(\d{2})/); if(!m)return f;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return `${DIAS[d.getDay()]} ${+m[3]} ${MES[+m[2]-1]}`; }
function fechaCorta(f){ const m=String(f).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m)return f; return `${+m[3]} ${MES[+m[2]-1]}`; }
const MESES_L=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fechaLarga(f){ const m=String(f).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m)return f;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return `${DIAS[d.getDay()]}, ${+m[3]} de ${MESES_L[+m[2]-1].toLowerCase()}`; }
const ESTADOS={confirmada:['#EAF3DE','#3B6D11'],pendiente:['#FAEEDA','#854F0B'],
  completada:['#E6F1FB','#0C447C'],cancelada:['#F1EFE8','#5F5E5A'],no_show:['#FCEBEB','#A32D2D']};

/* ---------- App ---------- */
function App(){
  const ss=(k,d='')=>{ try{ return sessionStorage.getItem(k)||d; }catch(e){ return d; } };
  const [authed,setAuthed]=useState(()=>ss('syna_auth')==='1');
  const [rol,setRol]=useState(()=>ss('syna_rol'));
  const [nombre,setNombre]=useState(()=>ss('syna_nombre'));
  const [tab,setTab]=useState('principal');
  const [areas,setAreas]=useState([]);
  const [servicios,setServicios]=useState([]);
  const [cargando,setCargando]=useState(true);
  const [err,setErr]=useState('');
  const [refreshKey,setRefreshKey]=useState(0);
  const [refreshing,setRefreshing]=useState(false);
  const [menuOpen,setMenuOpen]=useState(false);
  const [asistenteOn,setAsistenteOn]=useState(()=>ss('syna_asis','1')!=='0');

  useEffect(()=>{ if(!authed) return; (async()=>{
    try{
      const [a,s]=await Promise.all([apiGet('getAreas'),apiGet('getServicios')]);
      if(a.ok) setAreas(a.areas);
      if(s.ok) setServicios(s.servicios);
      if(!a.ok||!s.ok) setErr('No se pudo cargar el catálogo.');
    }catch(e){ setErr('Error de conexión con la API.'); }
    setCargando(false);
  })()},[authed]);

  const colorArea = nm => (areas.find(a=>a.area===nm)||{}).color || '#999';
  const go = t => setTab(t);
  const onLogin = (r) => {
    try{ sessionStorage.setItem('syna_auth','1');
         sessionStorage.setItem('syna_rol', (r&&r.rol)||'');
         sessionStorage.setItem('syna_nombre', (r&&r.nombre)||''); }catch(e){}
    setRol((r&&r.rol)||''); setNombre((r&&r.nombre)||''); setTab('principal'); setAuthed(true);
  };
  const salir = () => {
    try{ sessionStorage.removeItem('syna_auth'); sessionStorage.removeItem('syna_rol'); sessionStorage.removeItem('syna_nombre'); }catch(e){}
    setAuthed(false);
  };
  const onRefresh = () => { setRefreshing(true); setRefreshKey(k=>k+1); setTimeout(()=>setRefreshing(false),700); };
  const toggleAsis = () => { const nv=!asistenteOn; setAsistenteOn(nv); try{ sessionStorage.setItem('syna_asis', nv?'1':'0'); }catch(e){} if(!nv && tab==='asistente') setTab('principal'); };

  if(!authed) return <div id="app"><Login onLogin={onLogin}/></div>;

  return (
    <div id="app">
      <header>
        <img className="logo" src="logo_icon_solo.png" alt="SYNA" />
        <div className="menu-wrap">
          <button className="menu-btn" onClick={()=>setMenuOpen(o=>!o)} aria-label="Menú">S</button>
          {menuOpen && <>
            <div className="menu-ov" onClick={()=>setMenuOpen(false)}></div>
            <div className="menu-pop">
              <div className="menu-row">
                <span>Asistente virtual</span>
                <button className={"sw-toggle"+(asistenteOn?' on':'')} onClick={toggleAsis} aria-label="Activar o desactivar asistente"><span className="sw-knob"></span></button>
              </div>
              <div className="menu-sep"></div>
              <button className="menu-item" onClick={()=>{setMenuOpen(false);salir();}}>Salir</button>
            </div>
          </>}
        </div>
      </header>
      <main>
        {cargando ? <div className="spinner"></div> :
         err ? <div className="empty">{err}<br/><br/>Revisa que la URL de la API esté bien.</div> :
         <div key={tab+':'+refreshKey} className="view">
           {tab==='principal'   ? <Principal rol={rol} nombre={nombre} colorArea={colorArea} go={go} asistenteOn={asistenteOn}/> :
            tab==='calendario'  ? <Agenda servicios={servicios} colorArea={colorArea}/> :
            tab==='reservar'    ? <Reservar areas={areas} servicios={servicios} colorArea={colorArea}/> :
            (tab==='asistente' && asistenteOn) ? <Asistente/> :
            tab==='seguimiento' ? <Seguimiento/> :
            tab==='fidelidad'   ? <Fidelidad/> :
            <Principal rol={rol} nombre={nombre} colorArea={colorArea} go={go} asistenteOn={asistenteOn}/>}
         </div>}
      </main>
      <MenuFlotante tab={tab} go={go} onRefresh={onRefresh} refreshing={refreshing}/>
    </div>
  );
}

/* ---------- Flujo de reservar (multi-servicio) ---------- */
function Reservar({areas,servicios,colorArea}){
  const [nombre,setNombre]=useState('');
  const [tel,setTel]=useState('');
  const [dia,setDia]=useState(hoy());
  const [hora,setHora]=useState('');
  const [tipo,setTipo]=useState('normal');
  const [filas,setFilas]=useState([{area:'',sid:''}]);
  const [promos,setPromos]=useState(null);
  const [promoNum,setPromoNum]=useState('');
  const [slots,setSlots]=useState(null);
  const [cerrado,setCerrado]=useState(false);
  const [enviando,setEnviando]=useState(false);
  const [aviso,setAviso]=useState('');
  const [hecho,setHecho]=useState(null);

  useEffect(()=>{ (async()=>{ try{ const r=await apiGet('getPromos'); setPromos(r.ok?r.promos:[]); }catch(e){ setPromos([]); } })(); },[]);

  const svcPorId=useMemo(()=>{const m={};servicios.forEach(s=>m[s.id]=s);return m;},[servicios]);
  const promo=(promos||[]).find(p=>p.numero===promoNum)||null;
  const elegidos = tipo==='promo' ? (promo?promo.servicios:[]) : filas.map(f=>f.sid).filter(Boolean);
  const firstSid = elegidos[0]||'';

  useEffect(()=>{ setHora(''); if(!firstSid){ setSlots(null); setCerrado(false); return; }
    (async()=>{ setSlots(null); try{ const r=await apiGet('getDisponibilidad',{servicio_id:firstSid,fecha:dia});
      if(r.ok){ setSlots(r.slots||[]); setCerrado(!!r.cerrado); } else setSlots([]); }catch(e){ setSlots([]); } })();
  },[firstSid,dia]);

  const money=n=>'$'+Math.round(n||0);
  const totalPrecio = tipo==='promo' ? (promo?promo.precio:0) : elegidos.reduce((s,id)=>s+((svcPorId[id]&&+svcPorId[id].precio)||0),0);
  const totalDur = elegidos.reduce((s,id)=>s+((svcPorId[id]&&+svcPorId[id].duracion)||0),0);

  const cambiarTipo=t=>{ setTipo(t); setAviso('');
    if(t==='normal') setFilas(f=>[f[0]||{area:'',sid:''}]);
    else if(t==='mixto'||t==='especial') setFilas(f=>{ const n=[...f]; while(n.length<2)n.push({area:'',sid:''}); return n; }); };
  const setFila=(i,patch)=> setFilas(f=>f.map((x,j)=>j===i?{...x,...patch}:x));
  const addFila=()=> setFilas(f=>[...f,{area:'',sid:''}]);
  const delFila=i=> setFilas(f=>f.length>1?f.filter((_,j)=>j!==i):f);

  const agendar=async()=>{
    if(!nombre.trim()) return setAviso('Pon el nombre de la clienta');
    if(!elegidos.length) return setAviso(tipo==='promo'?'Elige una promoción':'Elige al menos un servicio');
    if(!hora) return setAviso('Elige la hora');
    setEnviando(true); setAviso('');
    try{
      const r=await apiPost('crearCitaMulti',{servicios:elegidos,fecha:dia,hora_inicio:hora,cliente_nombre:nombre.trim(),telefono:tel.trim()});
      if(r.ok) setHecho(r); else setAviso(r.error||'No se pudo agendar');
    }catch(e){ setAviso('Error de conexión'); }
    setEnviando(false);
  };
  const reset=()=>{ setHecho(null);setNombre('');setTel('');setDia(hoy());setHora('');setTipo('normal');setFilas([{area:'',sid:''}]);setPromoNum('');setAviso(''); };

  if(hecho) return (
    <div className="fade" style={{textAlign:'center'}}>
      <div className="ok-circle" style={{background:colorArea(hecho.citas[0].area)}}>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div className="display" style={{fontSize:22,fontWeight:600}}>¡Cita agendada!</div>
      <div className="card summary" style={{marginTop:18,textAlign:'left'}}>
        <div className="row"><span className="k">Clienta</span><span>{hecho.cliente_nombre}</span></div>
        <div className="row"><span className="k">Fecha</span><span>{fechaBonita(hecho.fecha)}</span></div>
        {hecho.citas.map(c=>(
          <div className="row" key={c.id}><span className="k">{c.servicio}</span><span>{c.hora_inicio}–{c.hora_fin} · {c.staff_asignado}</span></div>
        ))}
      </div>
      <button className="btn" onClick={reset}>Nueva cita</button>
    </div>
  );

  return (
    <div className="fade">
      <div className="sec-title">Agendar cita</div>

      <label>Clienta *</label>
      <input className="inp" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Nombre de la clienta" />
      <label>Teléfono</label>
      <input className="inp" type="tel" value={tel} onChange={e=>setTel(e.target.value)} placeholder="0999999999" />

      <div className="grid2">
        <div><label>Día</label>
          <input type="date" className="date-input" value={dia} min={hoy()} onChange={e=>setDia(e.target.value)} /></div>
        <div><label>Hora</label>
          <select className="sel" value={hora} onChange={e=>setHora(e.target.value)}>
            <option value="">{!firstSid?'Elige servicio…':slots===null?'Cargando…':cerrado?'Cerrado 🌙':((slots||[]).length?'Elige hora…':'Sin horarios')}</option>
            {(slots||[]).map(h=><option key={h} value={h}>{h}</option>)}
          </select></div>
      </div>

      <label>Tipo de servicio</label>
      <div className="seg">
        {[['normal','Normal'],['mixto','Mixto (2)'],['especial','Especial (+2)'],['promo','Promoción']].map(([k,l])=>
          <button key={k} className={"seg-b"+(tipo===k?' on':'')} onClick={()=>cambiarTipo(k)}>{l}</button>)}
      </div>

      {tipo!=='promo' ? <>
        {filas.map((f,i)=>(
          <div className="srow" key={i}>
            <div className="srow-h"><span>Servicio {i+1}</span>{filas.length>1 && <button className="srow-x" onClick={()=>delFila(i)} aria-label="Quitar">×</button>}</div>
            <select className="sel" value={f.area} onChange={e=>setFila(i,{area:e.target.value,sid:''})}>
              <option value="">Área…</option>
              {areas.map(a=><option key={a.area} value={a.area}>{a.area}</option>)}
            </select>
            <select className="sel" value={f.sid} disabled={!f.area} onChange={e=>setFila(i,{sid:e.target.value})}>
              <option value="">{f.area?'Especifique…':'Elige área primero'}</option>
              {servicios.filter(s=>s.area===f.area).map(s=><option key={s.id} value={s.id}>{s.servicio} · {money(s.precio)} · {s.duracion}min</option>)}
            </select>
          </div>
        ))}
        <button className="addx" onClick={addFila}>+ Agregar servicio Extra</button>
      </> : <>
        <select className="sel" value={promoNum} onChange={e=>setPromoNum(e.target.value)}>
          <option value="">{promos===null?'Cargando…':((promos||[]).length?'No. de promo…':'Sin promos configuradas')}</option>
          {(promos||[]).map(p=><option key={p.numero} value={p.numero}>#{p.numero} · {p.nombre}</option>)}
        </select>
        {promo && <div className="promo-box">
          <div className="promo-t">Incluye</div>
          {promo.servicios.map(id=><span key={id} className="promo-chip">{svcPorId[id]?svcPorId[id].servicio:id}</span>)}
        </div>}
      </>}

      {elegidos.length>0 && <div className="tot-line">{elegidos.length} servicio{elegidos.length>1?'s':''} · {totalDur} min · {money(totalPrecio)}</div>}
      {aviso && <div className="aviso">{aviso}</div>}
      <button className="btn" disabled={enviando} onClick={agendar}>{enviando?'Agendando…':'Agendar cita'}</button>
    </div>
  );
}

/* ---------- Swipe lateral (reagendar / eliminar) ---------- */
function SwipeRow({children,onReagendar,onEliminar}){
  const W=164;
  const [dx,setDx]=useState(0);
  const drag=React.useRef(false);
  const start=React.useRef(0);
  const moved=React.useRef(false);
  const down=e=>{ drag.current=true; moved.current=false; start.current=e.clientX-dx; try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){ } };
  const move=e=>{ if(!drag.current) return; let nx=e.clientX-start.current; if(Math.abs(nx-dx)>3) moved.current=true; nx=Math.max(-W,Math.min(0,nx)); setDx(nx); };
  const up=()=>{ if(!drag.current) return; drag.current=false; setDx(dx < -W/2 ? -W : 0); };
  const click=()=>{ if(!moved.current && dx<0) setDx(0); };
  return (
    <div className="swipe">
      <div className="swipe-actions">
        <button className="sw sw-reag" onClick={()=>{setDx(0);onReagendar();}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Reagendar</button>
        <button className="sw sw-elim" onClick={()=>{setDx(0);onEliminar();}}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          Eliminar</button>
      </div>
      <div className="swipe-front" style={{transform:`translateX(${dx}px)`,transition:drag.current?'none':'transform .22s cubic-bezier(.2,.8,.2,1)'}}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onClick={click}>
        {children}
      </div>
    </div>
  );
}

/* ---------- Modal Reagendar ---------- */
function ReagendarModal({reserva,servicios,colorArea,onClose,onDone}){
  const svc=servicios.find(x=>x.id===reserva.servicio_id);
  const [fecha,setFecha]=useState(reserva.fecha||hoy());
  const [slots,setSlots]=useState(null);
  const [hora,setHora]=useState(null);
  const [guardando,setGuardando]=useState(false);
  const [msg,setMsg]=useState('');
  const cargar=async(f)=>{ setSlots(null); setHora(null);
    try{ const r=await apiGet('getDisponibilidad',{servicio_id:reserva.servicio_id,fecha:f}); setSlots(r.ok?(r.slots||[]):[]); }
    catch(e){ setSlots([]); } };
  useEffect(()=>{cargar(fecha)},[]);
  const guardar=async()=>{
    if(!hora){ setMsg('Elige una hora'); return; }
    setGuardando(true); setMsg('');
    try{ const r=await apiPost('reagendarReserva',{id:reserva.id,nueva_fecha:fecha,nueva_hora:hora});
      if(r&&r.ok) onDone(); else setMsg((r&&r.error)||'No se pudo reagendar'); }
    catch(e){ setMsg('Error de conexión'); }
    setGuardando(false);
  };
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">Reagendar<button className="modal-x" onClick={onClose}>×</button></div>
        <div className="muted" style={{fontSize:13,margin:'2px 0 14px'}}>{reserva.cliente_nombre||'—'} · {svc?svc.servicio:reserva.servicio_id}</div>
        <input type="date" className="date-input" value={fecha} onChange={e=>{setFecha(e.target.value);cargar(e.target.value);}} />
        {slots===null ? <div className="spinner"></div> :
         slots.length===0 ? <div className="empty" style={{padding:'22px 0'}}>Sin horarios disponibles ese día</div> :
         <div className="slots">{slots.map(h=>(
           <button key={h} className={"slot"+(hora===h?' on':'')} style={hora===h?{background:colorArea(reserva.area)}:null} onClick={()=>setHora(h)}>{h}</button>
         ))}</div>}
        {msg && <div style={{color:'#E5484D',fontSize:13,textAlign:'center',marginTop:10}}>{msg}</div>}
        <button className="btn" disabled={guardando||!hora} onClick={guardar}>{guardando?'Guardando…':'Confirmar nueva hora'}</button>
      </div>
    </div>
  );
}

/* ---------- Agenda / Calendario del mes ---------- */
function Agenda({servicios,colorArea}){
  const ahora=new Date();
  const [cur,setCur]=useState({y:ahora.getFullYear(),m:ahora.getMonth()});
  const [mesData,setMesData]=useState(null);
  const [sel,setSel]=useState(hoy());
  const [filtro,setFiltro]=useState('todos');
  const [reagendar,setReagendar]=useState(null);
  const svcMap=useMemo(()=>{const m={};servicios.forEach(s=>m[s.id]=s);return m;},[servicios]);

  const pad2=n=>String(n).padStart(2,'0');
  const mesStr=`${cur.y}-${pad2(cur.m+1)}`;
  const cargarMes=async()=>{ setMesData(null);
    try{ const r=await apiGet('getReservasMes',{mes:mesStr}); setMesData(r.ok?r.reservas:[]); }catch(e){ setMesData([]); } };
  useEffect(()=>{cargarMes()},[cur.y,cur.m]);
  const cancelar=async(id)=>{ if(!confirm('¿Eliminar esta cita?'))return; await apiPost('cancelarReserva',{id}); cargarMes(); };

  const selEnMes=sel.slice(0,7)===mesStr;
  const data=useMemo(()=> (mesData||[]).filter(r=>r.fecha===sel), [mesData,sel]);
  const conCitas=useMemo(()=>{ const s={}; (mesData||[]).forEach(r=>{ const e=(r.estado||'').toLowerCase(); if(e!=='cancelada'&&e!=='no_show'){ const d=+r.fecha.slice(8,10); s[d]=(s[d]||0)+1; } }); return s; },[mesData]);

  const hoyStr=hoy();
  const pm=t=>{ const m=String(t).match(/(\d{1,2}):(\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
  const hhmm=m=>{ const z=n=>(n<10?'0':'')+n; return z(Math.floor(m/60))+':'+z(m%60); };
  const money=n=>'$'+Math.round(n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

  // Horario del día (réplica de la hoja Horarios)
  const HOR={1:['09:00','19:00'],2:['09:00','19:00'],3:['09:00','19:00'],4:['09:00','19:00'],5:['09:00','19:00'],6:['08:00','17:00'],0:null};
  const dow=new Date(sel+'T12:00:00').getDay(); const hh=HOR[dow]; const cerrado=!hh;
  const abre=hh?pm(hh[0]):540, cierra=hh?pm(hh[1]):1140, CORTE=13*60;

  const catDe=(svc)=>{ if(!svc)return 'normal';
    const a=(svc.area||'').toLowerCase(), g=(svc.grupo||'').toLowerCase(), n=(svc.servicio||'').toLowerCase(), p=+svc.precio||0;
    if(a==='facial')return 'facial';
    if(g.indexOf('retoque')>=0 || n.indexOf('retoque')===0)return 'retoque';
    if(g.indexOf('combo')>=0 || n.indexOf('combo')>=0 || n.indexOf('paquete')>=0)return 'combo';
    if(n.indexOf('neutraliz')>=0 || n.indexOf('correcc')>=0)return 'correccion';
    if(a==='pestañas' || g.indexOf('extensiones')>=0 || g.indexOf('permanente')>=0 || n.indexOf('volumen')>=0 || n.indexOf('hawaiano')>=0 || n.indexOf('mega')>=0 || n.indexOf('efecto polvo')>=0 || p>=50)return 'premium';
    return 'normal'; };

  const citas=useMemo(()=> (data||[])
    .filter(r=>{ const e=(r.estado||'').toLowerCase(); return e!=='cancelada' && e!=='no_show'; })
    .map(r=>{ const svc=svcMap[r.servicio_id]; const ini=pm(r.hora_inicio); let fin=pm(r.hora_fin);
      if(fin==null||fin<=ini) fin=ini+((svc&&svc.duracion)||30);
      return {...r, ini, fin, svc, precio:(svc&&+svc.precio)||0, cat:catDe(svc)}; })
    .filter(c=>c.ini!=null).sort((a,b)=>a.ini-b.ini), [data,svcMap]);

  const enBloque=(c,b0,b1)=> c.ini>=b0 && c.ini<b1;
  const mCitas=citas.filter(c=>enBloque(c,abre,CORTE));
  const tCitas=citas.filter(c=>enBloque(c,CORTE,cierra+1));
  const suma=arr=>arr.reduce((s,c)=>s+c.precio,0);
  const mVal=suma(mCitas), tVal=suma(tCitas), totVal=mVal+tVal;
  const premiumCount=citas.filter(c=>c.cat==='premium').length;

  const ocupado=(b0,b1)=>{ const iv=citas.map(c=>[Math.max(c.ini,b0),Math.min(c.fin,b1)]).filter(p=>p[1]>p[0]).sort((a,b)=>a[0]-b[0]);
    let cov=0,end=-1; iv.forEach(p=>{ const s=Math.max(p[0],end); if(p[1]>s)cov+=p[1]-s; end=Math.max(end,p[1]); });
    const span=b1-b0; return span>0?Math.min(100,Math.round(cov/span*100)):0; };
  const mOcc=ocupado(abre,CORTE), tOcc=ocupado(CORTE,cierra);
  const libresEn=(b0,b1)=>{ let n=0; for(let t=b0;t+15<=b1;t+=15){ if(!citas.some(c=>c.ini<t+15 && c.fin>t))n++; } return n; };
  const libresTot=libresEn(abre,CORTE)+libresEn(CORTE,cierra);

  const pasaFiltro=c=>{ if(filtro==='todos')return true;
    if(filtro==='premium')return c.cat==='premium';
    if(filtro==='retoques')return c.cat==='retoque';
    const a=(c.area||'').toLowerCase();
    if(filtro==='pestanas')return a==='pestañas';
    if(filtro==='cejas')return a==='cejas';
    if(filtro==='facial')return a==='facial';
    return true; };
  const filas=(b0,b1)=>{ const disp=citas.filter(c=>c.ini>=b0 && c.ini<b1 && pasaFiltro(c));
    if(filtro!=='todos') return disp.map(c=>({type:'cita',c}));
    let cur=b0; citas.forEach(c=>{ if(c.ini<b0 && c.fin>b0) cur=Math.max(cur,Math.min(c.fin,b1)); });
    const rows=[]; disp.forEach(c=>{ if(c.ini-cur>=15) rows.push({type:'libre',a:cur,b:c.ini}); rows.push({type:'cita',c}); cur=Math.max(cur,Math.min(c.fin,b1)); });
    if(b1-cur>=15) rows.push({type:'libre',a:cur,b:b1});
    return rows; };

  const filaCita=(c)=>(
    <SwipeRow key={c.id} onReagendar={()=>setReagendar(c)} onEliminar={()=>cancelar(c.id)}>
      <div className={"ag-cita cat-"+c.cat}>
        <div className="ag-time">{hhmm(c.ini)}<small>{hhmm(c.fin)}</small></div>
        <div className="ag-info">
          <div className="ag-cli">{c.cliente_nombre||'—'}</div>
          <div className="ag-srv">{c.svc?c.svc.servicio:c.servicio_id}</div>
        </div>
        {c.precio?<div className="ag-pric">{money(c.precio)}</div>:null}
      </div>
    </SwipeRow>
  );
  const renderFilas=rows=> rows.length===0
    ? <div className="ag-vacio">Sin citas</div>
    : rows.map((row,i)=> row.type==='libre'
        ? <div key={'l'+i} className="ag-libre"><span className="ag-libre-dot"></span>Libre · {hhmm(row.a)}–{hhmm(row.b)} <small>({row.b-row.a} min)</small></div>
        : filaCita(row.c));

  const FILTROS=[['todos','Todos'],['premium','✨ Premium'],['pestanas','Pestañas'],['cejas','Cejas'],['facial','Faciales'],['retoques','Retoques']];

  const fechaDe=d=>`${cur.y}-${pad2(cur.m+1)}-${pad2(d)}`;
  const primeroDow=new Date(cur.y,cur.m,1).getDay(); const off=(primeroDow===0?6:primeroDow-1);
  const diasMes=new Date(cur.y,cur.m+1,0).getDate();
  const celdas=[]; for(let i=0;i<off;i++)celdas.push(null); for(let d=1;d<=diasMes;d++)celdas.push(d);
  const cambiarMes=delta=>{let m=cur.m+delta,y=cur.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}setCur({y,m});};

  // ---- timeline por columnas (staff / área) ----
  const PPM=1.35;
  const tlH=Math.max(60,(cierra-abre)*PPM);
  const horas=[]; for(let h=Math.ceil(abre/60); h*60<=cierra; h++) horas.push(h);
  const hLbl=h=>{ const ap=h<12?'am':'pm'; let x=h%12; if(x===0)x=12; return x+ap; };
  const tipoDe=svc=>{ if(!svc)return 'cejas_short';
    const a=(svc.area||'').toLowerCase(), g=(svc.grupo||'').toLowerCase(), n=(svc.servicio||'').toLowerCase(), dur=+svc.duracion||30;
    if(g.indexOf('permanente')>=0 || n.indexOf('efecto polvo')>=0) return 'permanente';
    if(a==='facial') return 'facial';
    if(a==='pestañas') return 'pestanas';
    if(a==='depilaciones' || g.indexOf('depila')>=0 || n.indexOf('depila')>=0 || n.indexOf('bikini')>=0 || n.indexOf('axila')>=0) return 'depilacion';
    return dur>60?'cejas_long':'cejas_short'; };
  const colDe=svc=>{ const t=tipoDe(svc);
    return t==='permanente'?'Permanentes': t==='facial'?'Facial': t==='pestanas'?'Pestañas':'Cejas'; };
  const COLS=['Cejas','Facial','Pestañas','Permanentes'];
  const COLWASH={Cejas:'#EAF5EE',Facial:'#EAF1FA','Pestañas':'#FAF7E6',Permanentes:'#F6EFF8'};
  const TIPOCOL={ cejas_long:['#8DCBA6','#1F4D33'], cejas_short:['#C6E6D2','#2C5E40'], depilacion:['#ECC08A','#6E4410'],
    facial:['#AEC9E8','#234C7A'], pestanas:['#ECE08F','#6E6411'], permanente:['#D8BBE0','#5A3168'] };
  const LEYENDA=[['cejas_long','Cejas +1h'],['cejas_short','Cejas −1h'],['depilacion','Depil.'],['facial','Facial'],['pestanas','Pestañas'],['permanente','Perm.']];

  return (
    <div className="fade">
      <div className="sec-title">Agenda</div>

      <div className="cal card">
        <div className="cal-head">
          <button className="cal-nav" onClick={()=>cambiarMes(-1)} aria-label="Mes anterior">‹</button>
          <div className="cal-mes">{MESES_L[cur.m]}{cur.y!==ahora.getFullYear()?(' '+cur.y):''}</div>
          <button className="cal-nav" onClick={()=>cambiarMes(1)} aria-label="Mes siguiente">›</button>
        </div>
        <div className="cal-dows">{['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((d,i)=><span key={i} className={"cal-dow"+(i===5?' sab':'')+(i===6?' dom':'')}>{d}</span>)}</div>
        <div className="cal-grid">
          {celdas.map((d,i)=>{ if(d===null)return <span key={i} className="cal-cell empty"></span>;
            const col=i%7,f=fechaDe(d); const cls="cal-cell"+(f===sel?' sel':'')+(f===hoyStr?' hoy':'')+(col===6?' dom':'')+(col===5?' sab':'');
            return <button key={i} className={cls} onClick={()=>setSel(f)}><span className="cd">{d}</span><span className={"cdot"+(conCitas[d]?'':' ghost')}></span></button>; })}
        </div>
      </div>

      <div className="sub" style={{textTransform:'capitalize'}}>{fechaLarga(sel)}</div>

      {!selEnMes ? <div className="empty" style={{padding:'22px 0'}}>Toca un día para ver su tablero</div> :
       mesData===null ? <div className="spinner"></div> :
       cerrado ? <div className="empty" style={{padding:'28px 0'}}>Domingo — no laboramos 🌙</div> :
       <>
         <div className="ag-resumen">{citas.length} citas · {money(totVal)} · {libresTot} libres</div>

         <div className="lg">
           {LEYENDA.map(([t,l])=><span key={t} className="lg-i"><i style={{background:TIPOCOL[t][0]}}></i>{l}</span>)}
         </div>

         <div className="tl-scroll">
           <div className="tl-inner" style={{minWidth:46+COLS.length*156}}>
             <div className="tl-hdr">
               <div className="tl-corner"></div>
               {COLS.map(c=><div key={c} className="tl-chead">{c}</div>)}
             </div>
             <div className="tl-body" style={{height:tlH}}>
               <div className="tl-gutter">
                 {horas.map(h=><div key={h} className="tl-hlabel" style={{top:(h*60-abre)*PPM}}>{hLbl(h)}</div>)}
               </div>
               {COLS.map(col=>(
                 <div key={col} className="tl-col" style={{background:COLWASH[col]}}>
                   {horas.map(h=><div key={h} className="tl-line" style={{top:(h*60-abre)*PPM}}></div>)}
                   {citas.filter(c=>colDe(c.svc)===col).map(c=>{
                     const cc=TIPOCOL[tipoDe(c.svc)]; const top=(c.ini-abre)*PPM, hgt=Math.max(22,(c.fin-c.ini)*PPM);
                     return (
                       <button key={c.id} className="tl-pill" style={{top,height:hgt,background:cc[0],color:cc[1]}} onClick={()=>setReagendar(c)}>
                         <div className="tl-pill-t">{hhmm(c.ini)} · {c.cliente_nombre||'—'}</div>
                         {hgt>=34 && <div className="tl-pill-s">{c.svc?c.svc.servicio:c.servicio_id}</div>}
                       </button>
                     );
                   })}
                 </div>
               ))}
             </div>
           </div>
         </div>
         <div className="tl-hint">Toca una cita para reagendar · desliza para ver todas las columnas →</div>
       </>}

      {reagendar && <ReagendarModal reserva={reagendar} servicios={servicios} colorArea={colorArea}
        onClose={()=>setReagendar(null)} onDone={()=>{setReagendar(null);cargarMes();}} />}
    </div>
  );
}

/* ---------- Asistente (chat IA) ---------- */
const SUGERENCIAS = [
  '¿Qué citas hay hoy?',
  'Agenda cejas mañana 3pm para Ana',
  '¿Hay espacio el sábado en la tarde?',
  'Reagenda mi última cita'
];
function Asistente(){
  const [msgs,setMsgs]=useState([{role:'assistant',text:'Hola 👋 Soy el asistente de SYNA. Dime qué necesitas — por ejemplo: "agenda depilación de cejas mañana a las 3pm para Ana".'}]);
  const [input,setInput]=useState('');
  const [cargando,setCargando]=useState(false);
  const finRef = React.useRef(null);

  useEffect(()=>{ if(finRef.current) finRef.current.scrollIntoView({behavior:'smooth'}); },[msgs,cargando]);

  const enviar=async(txt)=>{
    const t=(typeof txt==='string'?txt:input).trim();
    if(!t||cargando) return;
    const nuevos=[...msgs,{role:'user',text:t}];
    setMsgs(nuevos); setInput(''); setCargando(true);
    try{
      const r=await apiPost('chat',{history:nuevos});
      setMsgs(m=>[...m,{role:'assistant',text:r.reply||'(sin respuesta)'}]);
    }catch(e){ setMsgs(m=>[...m,{role:'assistant',text:'Ups, error de conexión. Intenta de nuevo.'}]); }
    setCargando(false);
  };

  return (
    <div className="fade chat-wrap">
      <div className="asis-head">
        <div className="asis-av">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6zM18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8z"/></svg>
        </div>
        <div className="asis-meta">
          <div className="asis-name">Asistente SYNA</div>
          <div className="asis-on">En línea</div>
        </div>
      </div>

      <div className="chat-msgs">
        {msgs.map((m,i)=>(
          <div key={i} className={"bubble "+(m.role==='assistant'?'bot':'me')}>{m.text}</div>
        ))}
        {msgs.length===1 && !cargando &&
          <div className="chips">
            {SUGERENCIAS.map((s,i)=>(
              <button key={i} className="chip" onClick={()=>enviar(s)}>{s}</button>
            ))}
          </div>}
        {cargando && <div className="typing"><span></span><span></span><span></span></div>}
        <div ref={finRef}></div>
      </div>

      <div className="chatbar"><div className="chatbar-in">
        <input value={input} placeholder="Escribe un mensaje…"
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==='Enter') enviar(); }} />
        <button className="send" disabled={cargando||!input.trim()} onClick={enviar} aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div></div>
    </div>
  );
}

/* ---------- Iconos (planos, unicolor) ---------- */
const IC = {
  cWeek: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4M9 14.5l2 2 4-4"/></svg>,
  cConf: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12l2.5 2.5 5-5"/></svg>,
  cPend: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 10h.01M15 10h.01"/><path d="M8.6 15.6Q12 13 15.4 15.6"/></svg>,
  cProx: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>,
  principal:   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>,
  calendario:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>,
  seguimiento: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4l2.3 4.7 5.2.75-3.75 3.65.9 5.15L12 15.9l-4.65 2.45.9-5.15L4.5 9.45l5.2-.75z"/></svg>,
  fidelidad:   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20s-7-4.3-7-9.3A3.7 3.7 0 0 1 12 7a3.7 3.7 0 0 1 7 3.7c0 5-7 9.3-7 9.3z"/></svg>,
  refresh:     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 11a8 8 0 1 0-.5 4"/><path d="M20 5v6h-6"/></svg>
};

/* ---------- Menú flotante ---------- */
function MenuFlotante({tab,go,onRefresh,refreshing}){
  const Btn = (id,label) => (
    <button className={"dk"+(tab===id?' on':'')} onClick={()=>go(id)}>{IC[id]}<span>{label}</span></button>
  );
  return (
    <nav className="dock">
      <div className="dock-in">
        {Btn('principal','Principal')}
        {Btn('calendario','Calendario')}
        <button className={"dk-refresh"+(refreshing?' spin':'')} onClick={onRefresh} aria-label="Actualizar">{IC.refresh}</button>
        {Btn('seguimiento','Seguim.')}
        {Btn('fidelidad','Fidelidad')}
      </div>
    </nav>
  );
}

/* ---------- Principal (dashboard) ---------- */
function Principal({rol,nombre,colorArea,go,asistenteOn}){
  const [d,setD]=useState(null);
  const [err,setErr]=useState('');
  useEffect(()=>{(async()=>{
    try{ const r=await apiGet('getResumen'); if(r&&r.ok) setD(r); else setErr('No se pudo cargar el resumen.'); }
    catch(e){ setErr('Error de conexión.'); }
  })()},[]);
  const esCEO = (rol||'').toLowerCase()==='admin';
  if(err) return <div className="empty">{err}</div>;
  if(!d) return <div className="spinner"></div>;
  const fila = (p,i,live) => (
    <div key={i} className={"resv"+(live?' enproc':'')} style={{borderLeftColor:colorArea(p.area)}}>
      <div className="time">{p.hora_inicio}<small>{p.hora_fin}</small></div>
      <div style={{flex:1,minWidth:0}}>
        <div className="who">{p.cliente}</div>
        <div className="what">{p.servicio} · {p.area}{p.staff?(' · '+p.staff):''}</div>
      </div>
      {live && <span className="live">●</span>}
    </div>
  );
  return (
    <div className="fade">
      <div className="sec-title">Hola{nombre?(', '+nombre.split(' ')[0]):''} 👋</div>
      <div className="muted" style={{margin:'-8px 2px 16px',fontSize:14}}>Semana {fechaCorta(d.semana.ini)} – {fechaCorta(d.semana.fin)}</div>

      <div className="hero">
        <div className="hcard h-week"><div className="hi">{IC.cWeek}</div><div className="hl">Citas Semana</div><div className="hn">{d.total}</div></div>
        <div className="hcard h-conf"><div className="hi">{IC.cConf}</div><div className="hl">Citas confirmadas</div><div className="hn">{d.confirmadas||0}</div></div>
        <div className="hcard h-pend"><div className="hi">{IC.cPend}</div><div className="hl">Sin confirmar</div><div className="hn">{d.pendientes||0}</div></div>
        <div className="hcard h-prox"><div className="hi">{IC.cProx}</div><div className="hl">Próximas a atender</div><div className="hn">{(d.proximas||[]).length}</div></div>
      </div>

      <div className="qa">
        <button className="qa-btn" onClick={()=>go('reservar')}>＋ Nueva reserva</button>
        {asistenteOn && <button className="qa-btn ghost" onClick={()=>go('asistente')}>✨ Asistente</button>}
      </div>

      <div className="stats">
        <div className="stat"><div className="n">{d.porRealizar}</div><div className="l">Por realizar</div></div>
        <div className="stat"><div className="n">{d.realizadas}</div><div className="l">Realizadas</div></div>
        <div className="stat"><div className="n">{d.total}</div><div className="l">Total semana</div></div>
      </div>

      <div className="sub">Citas por área</div>
      <div className="card areas-stat">
        {d.porArea.length===0 ? <div className="empty" style={{padding:'18px 0'}}>Sin citas esta semana</div> :
          d.porArea.map(a=>(
            <div key={a.area} className="arow">
              <span className="dot" style={{background:a.color}}></span>
              <span className="an">{a.area}</span>
              <span className="av">{a.n}</span>
            </div>
          ))}
      </div>

      {esCEO && <>
        <div className="sub">Próximas a atender <span className="muted" style={{fontWeight:400}}>· 2 h</span></div>
        {d.proximas.length===0 ? <div className="empty" style={{padding:'14px 0'}}>Nada en las próximas 2 horas</div> :
          d.proximas.map((p,i)=>fila(p,i,false))}

        <div className="sub">En proceso <span className="muted" style={{fontWeight:400}}>· ahora</span></div>
        {d.enProceso.length===0 ? <div className="empty" style={{padding:'14px 0'}}>Ninguna cita en curso</div> :
          d.enProceso.map((p,i)=>fila(p,i,true))}
      </>}

      {!esCEO && <div className="muted" style={{textAlign:'center',fontSize:12.5,marginTop:26}}>Vista de propietario · resumen semanal</div>}
    </div>
  );
}

/* ---------- Seguimiento (próximo paso) ---------- */

  return (
    <div className="fade">
      <div className="sec-title">Seguimiento de clientas</div>
      <div className="card stub">
        <div className="stub-ic">⭐️</div>
        <p>Evaluaremos la satisfacción de cada clienta justo después de su cita, con un breve conversatorio.</p>
        <p className="muted">Siguiente paso (lo diseñamos juntos): preguntas, escala de satisfacción y registro automático del resultado.</p>
      </div>
    </div>

}

/* ---------- Fidelidad (próximo paso) ---------- */
function Fidelidad(){
  return (
    <div className="fade">
      <div className="sec-title">Fidelidad de clientes</div>
      <div className="card stub">
        <div className="stub-ic">💜</div>
        <p>Mediremos qué tan fiel es cada clienta: frecuencia mensual, puntualidad, método de pago y quejas.</p>
        <p className="muted">Siguiente paso: definimos los indicadores y el puntaje de fidelidad.</p>

/* ---------- Login (acceso a la app) ---------- */
function Login({onLogin}){
  const [u,setU]=useState('');
  const [pw,setPw]=useState('');
  const [cargando,setCargando]=useState(false);
  const [err,setErr]=useState('');
  const entrar=async()=>{
    if(!u.trim()||!pw){ setErr('Ingresa usuario y contraseña'); return; }
    setCargando(true); setErr('');
    try{
      const r=await apiPost('login',{usuario:u.trim(),password:pw});
      if(r&&r.ok) onLogin(r); else setErr((r&&r.error)||'No se pudo ingresar');
    }catch(e){ setErr('Error de conexión'); }
    setCargando(false);
  };
  return (
    <div className="login">
      <div className="login-in">
        <div className="login-top">
          <img className="lg" src="logo_icon_solo.png" alt="SYNA" />
          <div className="field">
            <label>Usuario</label>
            <input className="inp" value={u} autoCapitalize="none" autoCorrect="off"
              onChange={e=>setU(e.target.value)} placeholder="Tu usuario" />
          </div>
          <div className="field">
            <label>Contraseña</label>
            <input className="inp" type="password" value={pw} placeholder="••••••••"
              onChange={e=>setPw(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') entrar(); }} />
          </div>
          <button className="btn" disabled={cargando} onClick={entrar}>
            {cargando?'Ingresando…':'Ingresar'}</button>
          {err && <div className="err">{err}</div>}
        </div>
        <div className="login-bottom">
          <div className="desc">SYNA es la agenda inteligente de tu centro de estética. Reserva, reagenda y organiza las citas de todas tus áreas en un solo lugar.</div>
          <div className="dev">
            <div className="by">Desarrollado por</div>
            <div className="co">DESOUSATECH S.A.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
